<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ترجمہ مشق — امتحان کی تیاری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12162a;
    --bg-2: #191f3a;
    --surface: #212850;
    --surface-2: #2a3162;
    --surface-hover: #323a72;
    --gold: #d8b34a;
    --gold-soft: #e8cd7a;
    --gold-dim: #7a6530;
    --text: #f3efe4;
    --text-dim: #a9afd0;
    --text-faint: #6b7099;
    --sage: #5fa382;
    --sage-soft: #2a4438;
    --terracotta: #cb6d63;
    --terracotta-soft: #452a2a;
    --radius: 20px;
    --radius-sm: 12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(216,179,74,0.08), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(95,163,130,0.06), transparent 45%),
      var(--bg);
  }
  .arabic{font-family:'Amiri', serif; direction:rtl;}
  .urdu{font-family:'Noto Nastaliq Urdu', serif; direction:rtl; line-height:2.4;}
  bdi.num{direction:ltr; unicode-bidi:isolate; font-family:'Inter',sans-serif;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:40px; position:relative;}
  ::-webkit-scrollbar{display:none;}

  /* ---------- header ---------- */
  .topbar{position:sticky; top:0; z-index:20; background:linear-gradient(180deg, var(--bg) 70%, transparent); padding:18px 18px 8px; backdrop-filter: blur(6px);}
  .brand-row{display:flex; align-items:center; justify-content:space-between;}
  .brand h1{font-family:'Noto Nastaliq Urdu',serif; font-size:22px; margin:0; font-weight:700; color:var(--gold-soft);}
  .brand p{margin:2px 0 0; font-size:12px; color:var(--text-dim); font-family:'Inter';}
  .countdown{background:var(--surface); border:1px solid var(--gold-dim); border-radius:14px; padding:8px 12px; text-align:center; min-width:64px;}
  .countdown .n{font-size:20px; font-weight:800; color:var(--gold); font-family:'Inter';}
  .countdown .l{font-size:10px; color:var(--text-dim); margin-top:1px;}
  .progress-track{height:6px; background:var(--surface); border-radius:6px; margin-top:14px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius:6px; transition:width .4s ease;}

  /* ---------- tasbih beads (signature element) ---------- */
  .tasbih{display:flex; align-items:center; gap:6px; overflow-x:auto; padding:16px 4px 6px; margin-top:4px;}
  .bead{flex:0 0 auto; width:16px; height:16px; border-radius:50%; background:var(--surface-2); border:1.5px solid var(--text-faint); cursor:pointer; transition:transform .15s;}
  .bead.marker{width:22px; height:22px; border-width:2px;}
  .bead.done{background:var(--gold); border-color:var(--gold-soft); box-shadow:0 0 8px rgba(216,179,74,0.5);}
  .bead.progress{background:var(--surface-2); border-color:var(--gold); border-width:2.5px;}
  .bead:active{transform:scale(0.85);}
  .thread{flex:0 0 10px; height:1.5px; background:var(--text-faint); opacity:.4;}

  /* ---------- cards / dashboard ---------- */
  .section-label{font-size:12px; color:var(--text-faint); margin:20px 18px 8px; letter-spacing:.05em;}
  .continue-card{margin:0 18px 6px; background:linear-gradient(135deg, var(--surface-2), var(--surface)); border:1px solid var(--gold-dim); border-radius:var(--radius); padding:16px; cursor:pointer;}
  .continue-card .cc-title{font-size:13px; color:var(--gold-soft); font-weight:600;}
  .continue-card .cc-sub{font-family:'Noto Nastaliq Urdu'; font-size:16px; margin-top:4px;}
  .list{padding:0 18px; display:flex; flex-direction:column; gap:10px;}
  .card{background:var(--surface); border-radius:var(--radius); padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; border:1px solid transparent; transition:border-color .15s, background .15s;}
  .card:active{background:var(--surface-hover);}
  .card.locked{opacity:.45; cursor:not-allowed;}
  .card .idx{width:34px; height:34px; border-radius:10px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:var(--gold-soft); flex:0 0 auto;}
  .card .body{flex:1; min-width:0;}
  .card .title{font-family:'Noto Nastaliq Urdu'; font-size:16px;}
  .card .meta{font-size:11px; color:var(--text-dim); margin-top:3px;}
  .badge{font-size:10px; padding:4px 9px; border-radius:20px; flex:0 0 auto; font-weight:600;}
  .badge.new{background:var(--surface-2); color:var(--text-dim);}
  .badge.learning{background:#2a3a5e; color:#9fc1f0;}
  .badge.test{background:#4a3b1e; color:var(--gold-soft);}
  .badge.done{background:var(--sage-soft); color:#a6e0c4;}
  .revision-card{background:linear-gradient(135deg, #2a2050, #1e1a3c); border:1px dashed var(--gold-dim);}
  .revision-card .idx{background:var(--gold-dim); color:#1a1400;}

  /* ---------- generic screen w/ header ---------- */
  .screen-head{display:flex; align-items:center; gap:12px; padding:16px 18px 8px; position:sticky; top:0; background:var(--bg); z-index:20;}
  .back-btn{width:36px; height:36px; border-radius:10px; background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; flex:0 0 auto;}
  .screen-title{flex:1;}
  .screen-title h2{font-family:'Noto Nastaliq Urdu'; font-size:18px; margin:0;}
  .screen-title p{font-size:11px; color:var(--text-dim); margin:2px 0 0;}
  .qcounter{font-size:12px; color:var(--text-dim); background:var(--surface); padding:5px 10px; border-radius:20px;}

  /* ---------- learn view ---------- */
  .qcard{background:var(--surface); border-radius:var(--radius); padding:20px; margin:14px 18px;}
  .qcard .src{font-size:22px; line-height:2.1; margin-bottom:14px;}
  .qcard .chunk-btn{display:inline-block; background:var(--surface-2); color:var(--gold-soft); border:1px solid var(--gold-dim); padding:8px 16px; border-radius:20px; font-size:13px; cursor:pointer; margin-bottom:10px;}
  .divider{height:1px; background:var(--surface-2); margin:14px 0;}
  .qcard .tgt{font-size:17px; color:var(--text-dim); line-height:2.2;}
  .qcard .tgt.urdu{color:var(--text);}
  .kw-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;}
  .kw{font-family:'Amiri'; font-size:13px; background:var(--surface-2); color:var(--gold-soft); padding:3px 10px; border-radius:10px;}
  .diff-dot{width:7px; height:7px; border-radius:50%; display:inline-block; margin-left:6px;}
  .diff-easy{background:var(--sage);} .diff-medium{background:var(--gold);} .diff-hard{background:var(--terracotta);}

  .footer-bar{position:sticky; bottom:0; padding:14px 18px 22px; background:linear-gradient(0deg, var(--bg) 60%, transparent); margin-top:10px;}
  .btn{display:block; width:100%; text-align:center; padding:15px; border-radius:16px; font-size:15px; font-weight:700; font-family:'Noto Nastaliq Urdu'; cursor:pointer; border:none;}
  .btn-primary{background:linear-gradient(135deg, var(--gold-soft), var(--gold)); color:#241d05;}
  .btn-secondary{background:var(--surface); color:var(--text); margin-top:8px; border:1px solid var(--surface-2);}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}
  .btn-correct{background:var(--sage-soft); color:#c9f0da; border:1px solid var(--sage);}
  .btn-wrong{background:var(--terracotta-soft); color:#f3cac6; border:1px solid var(--terracotta);}
  .btn-partial{background:#4a3b1e; color:var(--gold-soft); border:1px solid var(--gold-dim);}
  .btn-row-3{display:flex; gap:8px;}
  .btn-row-3 .btn{flex:1; padding:14px 6px; font-size:12.5px; line-height:1.6;}

  /* ---------- test view ---------- */
  .test-card{background:var(--surface); border-radius:var(--radius); padding:30px 22px; margin:20px 18px; min-height:160px; display:flex; align-items:center; justify-content:center; text-align:center;}
  .test-card .src{font-size:24px; line-height:2.2;}
  .reveal{background:var(--surface); border-radius:var(--radius); padding:22px; margin:0 18px 14px; border:1px solid var(--gold-dim);}
  .reveal .lbl{font-size:11px; color:var(--gold-soft); margin-bottom:8px;}
  .reveal .tgt{font-size:19px; line-height:2.2;}

  /* ---------- summary ---------- */
  .summary-hero{text-align:center; padding:30px 20px 10px;}
  .score-ring{width:130px; height:130px; margin:0 auto 14px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; border:4px solid var(--gold); position:relative;}
  .score-ring .pct{font-size:30px; font-weight:800; font-family:'Inter';}
  .summary-hero h3{font-family:'Noto Nastaliq Urdu'; font-size:18px; margin:6px 0 0;}
  .wrong-list{padding:0 18px; display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .wrong-item{background:var(--surface); border-radius:14px; padding:12px 14px; border-right:3px solid var(--terracotta);}
  .wrong-item.partial-item{border-right-color:var(--gold);}
  .wrong-item .src{font-size:15px; margin-bottom:5px;}
  .wrong-item .tgt{font-size:13px; color:var(--text-dim);}
  .wrong-item .status-badge{display:inline-block; font-size:10.5px; padding:2px 9px; border-radius:8px; margin-bottom:6px; font-family:'Inter';}
  .status-badge.wrong{background:var(--terracotta-soft); color:#f3cac6;}
  .status-badge.partial{background:#4a3b1e; color:var(--gold-soft);}

  .empty{text-align:center; padding:60px 30px; color:var(--text-dim); font-family:'Noto Nastaliq Urdu'; font-size:16px;}

  /* ---------- exam intro ---------- */
  .intro-wrap{min-height:82vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .intro-card{background:var(--surface); border:1px solid var(--gold-dim); border-radius:24px; padding:30px 22px; text-align:center; max-width:380px; animation: popIn .5s cubic-bezier(.2,.8,.2,1);}
  .intro-icon{font-size:42px; margin-bottom:8px; animation: floaty 2.2s ease-in-out infinite;}
  .intro-card h2{font-family:'Noto Nastaliq Urdu'; font-size:20px; margin:0 0 4px; color:var(--gold-soft);}
  .intro-sub{font-size:12px; color:var(--text-dim); margin-bottom:18px;}
  .intro-rules{text-align:right; display:flex; flex-direction:column; gap:9px; margin-bottom:22px;}
  .rule{background:var(--surface-2); border-radius:12px; padding:10px 14px; font-size:13px; font-family:'Noto Nastaliq Urdu'; line-height:1.9;}
  @keyframes popIn{ from{opacity:0; transform:scale(.9) translateY(14px);} to{opacity:1; transform:scale(1) translateY(0);} }
  @keyframes floaty{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  .settings-row{padding:24px 18px 10px; text-align:center;}
  .settings-row span{font-size:12px; color:var(--text-faint); text-decoration:underline; cursor:pointer;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const APP_DATA = [{"tamreen_no": 1, "title": "التمرین (1)", "type": "translation", "instruction": "اردو میں ترجمہ کرو۔", "total_questions": 20, "questions": [{"id": 1, "arabic": "إِنَّ اللهَ يَقْبَلُ دَعَوَاتِ الصَّالِحِيْنَ", "urdu": "یقیناً اللہ تعالیٰ نیک لوگوں کی دعا کو قبول فرماتا ہے۔", "keywords": ["إِنَّ", "يَقْبَلُ", "دَعَوَاتِ"], "difficulty": "easy"}, {"id": 2, "arabic": "أَوَدُّ أَنَّكَ فَائِزٌ فِي الْمُسَابَقَةِ.", "urdu": "میں چاہتا ہوں کہ تو مقابلے میں کامیاب ہو۔", "keywords": ["أَوَدُّ", "فَائِزٌ", "الْمُسَابَقَةِ"], "difficulty": "easy"}, {"id": 3, "arabic": "لَيْتَ أَخَاكَ ذُو مَنْطِقٍ عَذْبٍ.", "urdu": "کاش تیرا بھائی شیریں کلام ہوتا۔", "keywords": ["لَيْتَ", "ذُو", "عَذْبٍ"], "difficulty": "easy"}, {"id": 4, "arabic": "كَأَنَّ عِصَامًا يَحْمِلُ جَبَلًا.", "urdu": "گویا کہ عصام پہاڑ کو اٹھا لیتا ہے۔", "keywords": ["كَأَنَّ", "يَحْمِلُ", "جَبَلًا"], "difficulty": "easy"}, {"id": 5, "arabic": "لَعَلَّكَ نَدْمَانُ عَلَى خَطِيْئَتِكَ.", "urdu": "شاید کہ تو اپنی غلطی پر شرمندہ ہے۔", "keywords": ["لَعَلَّكَ", "نَدْمَانُ", "خَطِيْئَتِكَ"], "difficulty": "easy"}, {"id": 6, "arabic": "إِنَّ الْمَقْدُرَةَ تُذْهِبُ الْحَفِيْظَةَ.", "urdu": "بے شک طاقت و ہمت غصہ کو لے جاتی ہے۔", "keywords": ["الْمَقْدُرَةَ", "تُذْهِبُ", "الْحَفِيْظَةَ"], "difficulty": "easy"}, {"id": 7, "arabic": "سَمِعْتُ أَنَّكَ تَعْتَزِمُ السَّفَرَ.", "urdu": "میں نے سنا کہ تو سفر کا ارادہ رکھتا ہے۔", "keywords": ["سَمِعْتُ", "تَعْتَزِمُ", "السَّفَرَ"], "difficulty": "easy"}, {"id": 8, "arabic": "إِنَّ لِلْعُلَمَاءِ دَوْرًا عَظِيْمًا فِي نَهْضَةِ الْمُجْتَمَعِ.", "urdu": "بلا شبہ معاشرہ کی ترقی میں علماء کا اہم کردار ہے۔", "keywords": ["دَوْرًا", "عَظِيْمًا", "نَهْضَةِ"], "difficulty": "easy"}, {"id": 9, "arabic": "كَأَنَّ الْمُثَقَّفِيْنَ قَنَادِيْلُ تُضِيْءُ طَرِيْقَ الْجُهَلَاءِ.", "urdu": "گویا کہ تعلیم یافتہ لوگ ایسے چراغ ہیں جو جاہلوں کے راستہ کو روشن کرتے ہیں۔", "keywords": ["الْمُثَقَّفِيْنَ", "قَنَادِيْلُ", "تُضِيْءُ"], "difficulty": "easy"}, {"id": 10, "arabic": "إِنَّ أَخَاكَ صَغِيْرُ السِّنِّ لَكِنَّ تَفْكِيْرَهُ نَاضِجٌ.", "urdu": "یقیناً تیرا بھائی کم عمر ہے لیکن اس کی سوچ پختہ ہے۔", "keywords": ["صَغِيْرُ السِّنِّ", "تَفْكِيْرَهُ", "نَاضِجٌ"], "difficulty": "easy"}, {"id": 11, "arabic": "كَأَنَّ الْمُقَاتِلِيْنَ أُسُودٌ تَزْأَرُ فِي الْمَعْرَكَةِ.", "urdu": "گویا کہ جنگجو ایسے شیر ہیں جو لڑائی میں دھاڑتے ہیں۔", "keywords": ["الْمُقَاتِلِيْنَ", "أُسُودٌ", "تَزْأَرُ"], "difficulty": "easy"}, {"id": 12, "arabic": "لَيْتَ هَذِهِ الْمَلَايِيْنَ تُنْفَقُ لِإِسْعَادِ الْبَشَرِيَّةِ.", "urdu": "کاش یہ لاکھوں روپے نسل انسانی کی خوش حالی کے لیے خرچ کیے جاتے۔", "keywords": ["الْمَلَايِيْنَ", "تُنْفَقُ", "إِسْعَادِ"], "difficulty": "easy"}, {"id": 13, "arabic": "إِنَّ رِسَالَاتِ الْأَنْبِيَاءِ تَدْعُو جَمِيْعًا إِلَى تَوْقِيْرِ الْكِبَارِ.", "urdu": "بے شک نبیوں کے پیغامات تمام لوگوں کو بڑوں کی تعظیم کی طرف بلاتے ہیں۔", "keywords": ["رِسَالَاتِ", "تَدْعُو", "تَوْقِيْرِ"], "difficulty": "easy"}, {"id": 14, "arabic": "قِمَّةُ الْجَبَلِ عَالِيَةٌ وَ كَأَنَّهَا تَصِلُ إِلَى عَنَانِ السَّمَاءِ.", "urdu": "پہاڑ کی چوٹی بلند ہے گویا کہ وہ آسمان کی بلندی تک پہنچتی ہے۔", "keywords": ["قِمَّةُ", "عَالِيَةٌ", "عَنَانِ"], "difficulty": "easy"}, {"id": 15, "arabic": "يَكْفِيْكَ أَنِّي تَغَاضَيْتُ عَنْ أَخْطَائِكَ السَّابِقَةِ.", "urdu": "تجھے یہ بات کافی ہے کہ میں نے تیری گزشتہ غلطیوں سے چشم پوشی کرلی۔", "keywords": ["يَكْفِيْكَ", "تَغَاضَيْتُ", "أَخْطَائِكَ"], "difficulty": "easy"}, {"id": 16, "arabic": "إِنَّ مِنَ الشِّعْرِ لَحِكْمَةً وَإِنَّ مِنَ الْبَيَانِ لَسِحْرًا.", "urdu": "بلا شبہ کچھ اشعار حکمت و دانش مندی ہیں اور یقیناً بعض بیان سحر انگیز ہوتے ہیں۔", "keywords": ["الشِّعْرِ", "لَحِكْمَةً", "لَسِحْرًا"], "difficulty": "easy"}, {"id": 17, "arabic": "الزُّجَاجَةُ كَأَنَّهَا كَوْكَبٌ دُرِّيٌّ. [النور: ٣٥]", "urdu": "فانوس گویا کہ ایک چمک دار ستارہ ہے۔", "keywords": ["الزُّجَاجَةُ", "كَوْكَبٌ", "دُرِّيٌّ"], "difficulty": "easy"}, {"id": 18, "arabic": "أَلَا إِنَّ أَوْلِيَاءَ اللهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُوْنَ [یونس: ٦٢]", "urdu": "سن لو ب َّاسِ مَنْزِلَةً عِنْدَ اللهِ يَوْمَ الْقِيَامَةِ مَنْ تَرَكَهُ النَّاسُ اتِّقَاءَ فُحْشِهِ.", "urdu": "یقیناً قیامت کے دن اللہ کے نزدیک سب سے بدتر وہ شخص ہوگا جسے لوگوں نے اس کی بد زبانی سے بچنے کی خاطر چھوڑ دیا۔", "keywords": ["شَرَّ", "الْقِيَامَةِ", "فُحْشِهِ"], "difficulty": "hard"}, {"id": 6, "arabic": "إِنَّمَا شِفَاءُ الْعِيِّ السُّؤَالُ.", "urdu": "جاہل انسان کا علاج سوال کرنا ہے۔", "keywords": ["شِفَاءُ", "الْعِيِّ", "السُّؤَالُ"], "difficulty": "easy"}, {"id": 7, "arabic": "إِنَّمَا الْأَعْمَالُ بِالْخَوَاتِيمِ.", "urdu": "اعمال کا دار و مدار خاتمہ کے اعتبار سے ہے۔", "keywords": ["الْأَعْمَالُ", "بِالْخَوَاتِيمِ"], "difficulty": "easy"}, {"id": 8, "arabic": "إِنَّمَا الْقَبْرُ رَوْضَةٌ مِنْ رِيَاضِ الْجَنَّةِ أَوْ حُفْرَةٌ مِنْ حُفَرِ النَّارِ.", "urdu": "قبر جنت کے باغوں میں سے ایک باغ ہے یا جہنم کے گڑھوں میں سے ایک گڑھا۔", "keywords": ["الْقَبْرُ", "رَوْضَةٌ", "حُفْرَةٌ"], "difficulty": "medium"}, {"id": 9, "arabic": "إِنَّ لِرَبِّكَ عَلَيْكَ حَقًّا، وَإِنَّ لِأَهْلِكَ عَلَيْكَ حَقًّا، وَإِنَّ لِبَدَنِكَ عَلَيْكَ حَقًّا، فَأَعْطِ كُلَّ ذِي حَقٍّ حَقَّهُ.", "urdu": "بے شک تم پر تمہارے رب کا حق ہے اور یقیناً بیوی بچوں کا حق ہے اور یقیناً تم پر بدن کا حق ہے تو ہر حق والے کو اس کا حق دو۔", "keywords": ["حَقًّا", "لِأَهْلِكَ", "لِبَدَنِكَ"], "difficulty": "medium"}, {"id": 10, "arabic": "فَلَعَلَّكَ بَاخِعٌ نَفْسَكَ عَلَى آثَارِهِمْ إِنْ لَم| يُؤْمِنُوا بِهَذَا الْحَدِيثِ أَسَفًا.", "urdu": "تو کہیں تم غم سے اپنی جان پر کھیل جاؤ گے ان کے پیچھے اگر وہ اس بات پر ایمان نہ لائیں۔", "keywords": ["بَاخِعٌ", "آثَارِهِمْ", "أَسَفًا"], "difficulty": "hard"}, {"id": 11, "arabic": "قَالَ يَلَيْتَ بَيْنِي وَبَيْنَكَ بُعْدَ الْمَشْرِقَيْنِ فَبِئْسَ الْقَرِينُ.", "urdu": "کہے گا ہائے کسی طرح مجھ میں تجھ میں پورب پچھم کا فاصلہ ہوتا تو کیا ہی برا ساتھی ہے۔", "keywords": ["يَلَيْتَ", "الْمَشْرِقَيْنِ", "الْقَرِينُ"], "difficulty": "hard"}]}, {"tamreen_no": 4, "title": "التمرین (4)", "type": "translation", "instruction": "عربی میں ترجمہ کرو۔", "total_questions": 15, "questions": [{"id": 1, "arabic": "الْأَسَاتِذَةُ كَأَنَّهُمْ آبَاءٌ عَطُوفُونَ.", "urdu": "اساتذہ گویا مہربان باپ ہیں۔", "keywords": ["الْأَسَاتِذَةُ", "آبَاءٌ", "عَطُوفُونَ"], "difficulty": "easy"}, {"id": 2, "arabic": "مَاءُ هَذِهِ الْبِرْكَةِ كَأَنَّهُ مِرْآةٌ صَافِيَةٌ.", "urdu": "اس تالاب کا پانی گویا کہ صاف آئینہ ہے۔", "keywords": ["الْبِرْكَةِ", "مِرْآةٌ", "صَافِيَةٌ"], "difficulty": "easy"}, {"id": 3, "arabic": "إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ.", "urdu": "یقیناً نیکیاں برائیوں کو لے جاتی ہیں۔", "keywords": ["الْحَسَنَاتِ", "يُذْهِبْنَ", "السَّيِّئَاتِ"], "difficulty": "easy"}, {"id": 4, "arabic": "لَيْتَ هَذِهِ التَّجَارِبَ الْعِلْمِيَّةَ تَنْجَحُ.", "urdu": "کاش یہ سائنسی تجربات کامیاب ہوتے۔", "keywords": ["التَّجَارِبَ", "الْعِلْمِيَّةَ", "تَنْجَحُ"], "difficulty": "medium"}, {"id": 5, "arabic": "إِنَّ الْحَيَاةَ الْعَمَلِيَّةَ طَرِيقٌ مَمْلُوءٌ بِالْأَشْوَاكِ.", "urdu": "یقیناً عملی زندگی کانٹوں سے بھرا ہوا راستہ ہے۔", "keywords": ["الْحَيَاةَ", "الْعَمَلِيَّةَ", "بِالْأَشْوَاكِ"], "difficulty": "medium"}, {"id": 6, "arabic": "يَعْلَمُ كُلُّ رَجُلٍ أَنَّ الْكَهْرُبَاءَ تَجْرِي فِي الْأَسْلَاكِ.", "urdu": "ہر شخص جانتا ہے کہ بجلی تاروں میں دوڑتی ہے۔", "keywords": ["الْكَهْرُبَاءَ", "تَجْرِي", "الْأَسْلَاكِ"], "difficulty": "medium"}, {"id": 7, "arabic": "هَؤُلَاءِ النَّاسُ مُخْلِصُونَ فِي نِيَّاتِهِمْ لَكِنَّهُمْ آثِمُونَ.", "urdu": "یہ لوگ اپنی نیتوں میں مخلص ہیں مگر خطا کار ہیں۔", "keywords": ["مُخْلِصُونَ", "نِيَّاتِهِمْ", "آثِمُونَ"], "difficulty": "medium"}, {"id": 8, "arabic": "قَبَضَ الشُّرْطَةُ عَلَى هَؤُلَاءِ النَّاسِ لَكِنَّهُمْ أَبْرِيَاءُ.", "urdu": "پولیس نے ان لوگوں کو گرفتار کیا لیکن یہ بے قصور ہیں۔", "keywords": ["قَبَضَ", "الشُّرْطَةُ", "أَبْرِيَاءُ"], "difficulty": "medium"}, {"id": 9, "arabic": "إِنَّ الزَّرَافَةَ أَطْوَلُ عُنُقًا مِنَ الْجَمَلِ.", "urdu": "یقیناً زرافہ کی گردن اونٹ کی گردن سے زیادہ لمبی ہے۔", "keywords": ["الزَّرَافَةَ", "أَطْوَلُ", "عُنُقًا"], "difficulty": "medium"}, {"id": 10, "arabic": "إِنَّ الْأَغْنِيَاءَ كَثِيرُونَ لَكِنَّهُمْ لَا يُرَاعُونَ الْفُقَرَاءَ.", "urdu": "یقیناً مالدار بہت ہیں لیکن وہ غریبوں کا خیال نہیں کرتے۔", "keywords": ["الْأَغْنِيَاءَ", "يُرَاعُونَ", "الْفُقَرَاءَ"], "difficulty": "medium"}, {"id": 11, "arabic": "يَعْلَمُ كُلُّ رَجُلٍ أَنَّ التَّدْخِينَ مُضِرٌّ لِلصِّحَّةِ.", "urdu": "ہر شخص جانتا ہے کہ سگریٹ نوشی صحت کے لیے مضر ہے۔", "keywords": ["التَّدْخِينَ", "مُضِرٌّ", "لِلصِّحَّةِ"], "difficulty": "medium"}, {"id": 12, "arabic": "لَيْتَنِي كُنْتُ أَذْهَبُ لِزِيَارَةِ الْحَرَمَيْنِ هَذَا الْعَامَ.", "urdu": "کیا ہی اچھا ہوتا کہ میں اس سال زیارت حرمین کے لیے جاتا۔", "keywords": ["لَيْتَنِي", "زِيَارَةِ", "الْحَرَمَيْنِ"], "difficulty": "medium"}, {"id": 13, "arabic": "وَقَعَ الْحَرِيقُ فِي هَذَا الْبَيْتِ أَمْسِ لَكِنَّ رِجَالَ الْمَطَافِئِ أَطْفَئُوا النَّارَ.", "urdu": "کل اس گھر میں آگ لگی لیکن فائر بریگیڈ کے عملے نے آگ بجھا دی۔", "keywords": ["الْحَرِيقُ", "الْمَطَافِئِ", "أَطْفَئُوا"], "difficulty": "hard"}, {"id": 14, "arabic": "أُخْبِرْتُ بِالْهَاتِفِ أَنَّ الشُّرْطَةَ قَبَضَ عَلَى نَهَّابٍ خَطِيرٍ.", "urdu": "مجھے فون پر بتایا گیا کہ پولیس نے ایک خطرناک ڈاکو کو گرفتار کیا ہے۔", "keywords": ["الْهَاتِفِ", "قَبَضَ", "نَهَّابٍ"], "difficulty": "hard"}, {"id": 15, "arabic": "إِنَّ الْأَطِبَّاءَ يَسْتَخْدِمُونَ الْكَهْرُبَاءَ فِي عِلَاجِ أَمْرَاضِ الْعِظَامِ وَالْجِلْدِ.", "urdu": "یقیناً ڈاکٹر ہڈی اور چمڑے کی بیماریوں کے علاج میں بجلی استعمال کرتے ہیں۔", "keywords": ["الْأَطِبَّاءَ", "الْعِظَامِ", "الْجِلْدِ"], "difficulty": "hard"}]}, {"tamreen_no": 5, "title": "التمرین (5)", "type": "translation", "instruction": "اردو میں ترجمہ کرو۔", "total_questions": 20, "questions": [{"id": 1, "arabic": "لَا طَالِبَ حَقٍّ مَخْذُولٌ.", "urdu": "حق کا کوئی طلب گار رسوا نہیں ہے۔", "keywords": ["طَالِبَ", "حَقٍّ", "مَخْذُولٌ"], "difficulty": "easy"}, {"id": 2, "arabic": "لَا سَاعِيًا فِي الْخَيْرِ مَذْمُومٌ.", "urdu": "بھلائی میں کوئی کوشش کرنے والا برا نہیں ہے۔", "keywords": ["سَاعِيًا", "الْخَيْرِ", "مَذْمُومٌ"], "difficulty": "easy"}, {"id": 3, "arabic": "لَا رَاضِيًا عَنِ الذُّلِّ حُرٌّ.", "urdu": "بے عزتی سے راضی رہنے والا آزاد نہیں ہے۔", "keywords": ["رَاضِيًا", "الذُّلِّ", "حُرٌّ"], "difficulty": "easy"}, {"id": 4, "arabic": "لَا مُؤَدِّيًا وَاجِبَهُ نَادِمٌ.", "urdu": "اپنی ذمہ داری کو ادا کرنے والا شرمندہ نہیں ہے۔", "keywords": ["مُؤَدِّيًا", "وَاجِبَهُ", "نَادِمٌ"], "difficulty": "easy"}, {"id": 5, "arabic": "لَا مُعَلِّمَاتِ فِي الْمَدْرَسَةِ.", "urdu": "مدرسہ میں استانیاں نہیں ہیں۔", "keywords": ["مُعَلِّمَاتِ", "الْمَدْرَسَةِ"], "difficulty": "easy"}, {"id": 6, "arabic": "لَا ضِدَّيْنِ يَجْتَمِعَانِ.", "urdu": "کوئی دو متضاد چیزیں ایک ساتھ جمع نہیں ہو سکتیں۔", "keywords": ["ضِدَّيْنِ", "يَجْتَمِعَانِ"], "difficulty": "easy"}, {"id": 7, "arabic": "لَا شَاهِدَ زُورٍ مَحْبُوبٌ.", "urdu": "جھوٹ کی گواہی دینے والا پیارا نہیں ہے۔", "keywords": ["شَاهِدَ", "زُورٍ", "مَحْبُوبٌ"], "difficulty": "easy"}, {"id": 8, "arabic": "لَا فَقْرَ أَضَرُّ مِنَ الْجَهْلِ.", "urdu": "جہالت سے زیادہ نقصان دہ کوئی غربت نہیں ہے۔", "keywords": ["فَقْرَ", "أَضَرُّ", "الْجَهْلِ"], "difficulty": "easy"}, {"id": 9, "arabic": "لَا الرَّجُلُ كَرِيمٌ وَلَا ابْنُهُ.", "urdu": "نہ آدمی شریف ہے اور نہ اس کا بیٹا۔", "keywords": ["الرَّجُلُ", "كَرِيمٌ", "ابْنُهُ"], "difficulty": "easy"}, {"id": 10, "arabic": "لَا خَيْرَ فِي وُدِّ امْرِئٍ مُتَقَلِّبٍ.", "urdu": "غیر مستقل مزاج آدمی کی محبت میں کوئی بھلائی نہیں ہے۔", "keywords": ["خَيْرَ", "وُدِّ", "مُتَقَلِّبٍ"], "difficulty": "medium"}, {"id": 11, "arabic": "لَا مُكْثِرَ مُزَاحٍ مَهِيبٌ.", "urdu": "زیادہ مذاق کرنے والا بارعب نہیں ہے۔", "keywords": ["مُكْثِرَ", "مُزَاحٍ", "مَهِيبٌ"], "difficulty": "medium"}, {"id": 12, "arabic": "لَا مُتَشَارِكَيْنِ فِي نَافِعٍ مُحْتَقَرَانِ.", "urdu": "کسی نفع میں شریک ہونے والے دو لوگ حقیر نہیں ہیں۔", "keywords": ["مُتَشَارِكَيْنِ", "نَافِعٍ", "مُحْتَقَرَانِ"], "difficulty": "medium"}, {"id": 13, "arabic": "لَا مُطِيعًا وَالِدَيْهِ مَحْرُومٌ مِنْ رَحْمَةِ اللهِ.", "urdu": "اپنے والدین کی اطاعت کرنے والا اللہ کی رحمت سے محروم نہیں ہے۔", "keywords": ["مُطِيعًا", "وَالِدَيْهِ", "مَحْرُومٌ"], "difficulty": "medium"}, {"id": 14, "arabic": "لَا نَهْضَةَ مَعَ الْجَهْلِ وَلَا تَقَدُّمَ بِغَيْرِ الْعِلْمِ.", "urdu": "جہالت کے ساتھ کوئی بیداری نہیں اور علم کے بغیر کوئی ترقی نہیں۔", "keywords": ["نَهْضَةَ", "الْجَهْلِ", "تَقَدُّمَ"], "difficulty": "medium"}, {"id": 15, "arabic": "لَا حِلْيَةَ أَثْمَنُ مِنْ مَكَارِمِ الْأَخْلَاقِ.", "urdu": "عمدہ اخلاق سے زیادہ قیمتی کوئی زیور نہیں۔", "keywords": ["حِلْيَةَ", "أَثْمَنُ", "الْأَخْلَاقِ"], "difficulty": "medium"}, {"id": 16, "arabic": "لَا سَبِيلَ إِلَى السَّلَامَةِ مِنْ أَلْسِنَةِ الْعَامَّةِ.", "urdu": "عام لوگوں کی زبانوں سے سلامتی کی کوئی راہ نہیں", "keywords": ["سَبِيلَ", "السَّلَامَةِ", "أَلْسِنَةِ"], "difficulty": "medium"}, {"id": 17, "arabic": "وَصَلْتُ فِي نِقَاشِي مَعَكُمْ إِلَى لَا شَيْءٍ.", "urdu": "میں تمہارے ساتھ بحث و مباحثہ میں کسی نتیجہ تک نہیں پہنچا۔", "keywords": ["نِقَاشِي", "وَصَلْتُ", "شَيْءٍ"], "difficulty": "hard"}, {"id": 18, "arabic": "لَا مُدَخِّنَ أَوْ شَارِبَ خَمْرٍ بَيْنَنَا.", "urdu": "ہمارے درمیان کوئی سگریٹ نوشی کرنے والا اور کوئی شرابی نہیں ہے۔", "keywords": ["مُدَخِّنَ", "شَارِبَ", "خَمْرٍ"], "difficulty": "hard"}, {"id": 19, "arabic": "لَا عَقْلَ كَالتَّدْبِيرِ، وَلَا حَسَبَ كَحُسْنِ الْخُلُقِ، وَلَا وَرَعَ كَالْكَفِّ.", "urdu": "تدبیر کی طرح کوئی عقل نہیں، اچھے اخلاق کی طرح کوئی حسب نہیں اور پرہیزگاری کی طرح کوئی تقویٰ نہیں۔", "keywords": ["عَقْلَ", "التَّدْبِيرِ", "الْخُلُقِ"], "difficulty": "hard"}, {"id": 20, "arabic": "لَا فَقْرَ أَشَدُّ مِنَ الْجَهْلِ، وَلَا مَالَ أَعَزُّ مِنَ الْعَقْلِ، وَلَا وَحْشَةَ مِنَ الْعُجْبِ.", "urdu": "جہالت سے زیادہ سخت کوئی افلاس نہیں، عقل سے زیادہ محبوب کوئی مال نہیں اور خود پسندی سے زیادہ سخت کوئی خوف نہیں۔", "keywords": ["أَشَدُّ", "الْعَقْلِ", "الْعُجْبِ"], "difficulty": "hard"}]}, {"tamreen_no": 6, "title": "التمرین (6)", "type": "translation", "instruction": "عربی میں ترجمہ کرو۔", "total_questions": 15, "questions": [{"id": 1, "arabic": "لَا مُكْثِرَ مُزَاحٍ جَادٌّ.", "urdu": "کوئی زیادہ مذاق کرنے والا باوقار ن
