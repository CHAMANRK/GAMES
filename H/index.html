: ["نَبِيَّ", "آخِرَ", "نَبِيِّنَا"], "difficulty": "easy"}, {"id": 12, "arabic": "لَا الْعَصَبِيَّةُ فِي الْإِسْلَامِ وَلَا ضِيقُ الْفِكْرِ.", "urdu": "اسلام میں نہ کوئی تعصب ہے اور نہ تنگ نظری۔", "keywords": ["الْعَصَبِيَّةُ", "الْإِسْلَامِ", "ضِيقُ الْفِكْرِ"], "difficulty": "medium"}, {"id": 13, "arabic": "لَا مُسْرِفِينَ فِي الْأَعْرَاسِ مَحْبُوبُونَ.", "urdu": "شادیوں میں فضول خرچی کرنے والے پسندیدہ آدمی نہیں ہیں۔", "keywords": ["مُسْرِفِينَ", "الْأَعْرَاسِ", "مَحْبُوبُونَ"], "difficulty": "medium"}, {"id": 14, "arabic": "لَا كَانِسًا فِي فُصُولِ هَذِهِ الْجَامِعَةِ.", "urdu": "اس یونیورسٹی کی درس گاہوں میں کوئی جھاڑو لگانے والا نہیں ہے۔", "keywords": ["كَانِسًا", "فُصُولِ", "الْجَامِعَةِ"], "difficulty": "medium"}, {"id": 15, "arabic": "لَا مُقْتَصِدًا فِي الْمَصَارِيفِ مَلُومٌ.", "urdu": "اخراجات میں میانہ روی اختیار کرنے والا قابل مذمت نہیں ہے۔", "keywords": ["مُقْتَصِدًا", "الْمَصَارِيفِ", "مَلُومٌ"], "difficulty": "medium"}]}, {"tamreen_no": 7, "title": "التمرین (7)", "type": "translation", "instruction": "درج ذیل جملوں کا ترجمہ کرو اور ان کی نحوی ترکیب لکھو۔", "total_questions": 10, "questions": [{"id": 1, "arabic": "لَا حَارِسَيْنِ فِي الْبُسْتَانِ.", "urdu": "باغ میں محافظ نہیں ہیں۔", "keywords": ["حَارِسَيْنِ", "الْبُسْتَانِ"], "difficulty": "easy"}, {"id": 2, "arabic": "لَا مَعَ الْمُسَافِرِ مَاءٌ وَلَا زَادٌ.", "urdu": "مسافر کے پاس نہ پانی ہے اور نہ توشہ۔", "keywords": ["الْمُسَافِرِ", "مَاءٌ", "زَادٌ"], "difficulty": "easy"}, {"id": 3, "arabic": "لَا مُسْتَشِيرًا فِي أُمُورِهِ نَادِمٌ.", "urdu": "اپنے معاملات میں کوئی مشورہ کرنے والا شرمندہ نہیں ہے۔", "keywords": ["مُسْتَشِيرًا", "أُمُورِهِ", "نَادِمٌ"], "difficulty": "easy"}, {"id": 4, "arabic": "لَا مُؤْمِنَيْنِ مُتَخَاصِمُونَ.", "urdu": "مومن آپس میں جھگڑالو نہیں ہیں۔", "keywords": ["مُؤْمِنَيْنِ", "مُتَخَاصِمُونَ"], "difficulty": "easy"}, {"id": 5, "arabic": "لَا فَرْقَدَيْنِ مُفْتَرِقَانِ.", "urdu": "کوئی دو ستارے جدا نہیں ہیں۔", "keywords": ["فَرْقَدَيْنِ", "مُفْتَرِقَانِ"], "difficulty": "easy"}, {"id": 6, "arabic": "لَا سَاعِيًا فِي الصُّلْحِ مَكْرُوهٌ.", "urdu": "صلح میں کوئی کوشش کرنے والا قابل مذمت نہیں ہے۔", "keywords": ["سَاعِيًا", "الصُّلْحِ", "مَكْرُوهٌ"], "difficulty": "easy"}, {"id": 7, "arabic": "لَا دَفْتَرِي مَعِي وَلَا قَلَمِي.", "urdu": "میرے پاس نہ میری نوٹ بک ہے اور نہ میرا قلم۔", "keywords": ["دَفْتَرِي", "مَعِي", "قَلَمِي"], "difficulty": "easy"}, {"id": 8, "arabic": "لَا مُتَنَزَّهٌ فِي الْمَدِينَةِ بَلْ مُتَنَزَّهَاتٌ.", "urdu": "شہر میں ایک پارک نہیں بلکہ کئی پارک ہیں۔", "keywords": ["مُتَنَزَّهٌ", "الْمَدِينَةِ", "مُتَنَزَّهَاتٌ"], "difficulty": "medium"}, {"id": 9, "arabic": "لَا مُتَهَاوِنِينَ فِي أَدَاءِ وَاجِبَاتِهِمْ مَمْدُوحُونَ.", "urdu": "اپنے فرائض کی ادائیگی میں سستی کرنے والے قابل تعریف نہیں ہیں۔", "keywords": ["مُتَهَاوِنِينَ", "وَاجِبَاتِهِمْ", "مَمْدُوحُونَ"], "difficulty": "medium"}, {"id": 10, "arabic": "لَا طَاعَةَ لِمَخْلُوقٍ فِي مَعْصِيَةِ الْخَالِقِ.", "urdu": "اللہ تعالیٰ کی نافرمانی میں کسی مخلوق کی اطاعت و فرمانبرداری نہیں ہے۔", "keywords": ["طَاعَةَ", "مَخْلُوقٍ", "مَعْصِيَةِ"], "difficulty": "medium"}]}, {"tamreen_no": 8, "title": "التمرین (8)", "type": "passage", "instruction": "اردو میں ترجمہ کرو۔", "total_questions": 1, "questions": [{"id": 1, "arabic": "تَدِبُّ فِي مِصْرَ حَيَاةٌ لَم| تُعْهَدْ فِيْهَا مِنْ قَبْلُ، حَيَاةٌ كُلُّهَا خَيْرٌ وَ بَرَكَةٌ، فَفِي كُلِّ الْمَجَالَاتِ تَجِدُ الْحَيَوِيَّةَ الْمُتَدَفِّقَةَ، وَ النَّشَاطَ الْمَوْفُورَ، وَ التَّعَاوُنَ الصَّادِقَ فَلَا صَانِعَ مُهْمِلٌ، وَلَا صَاحِبَ مَصْنَعٍ مُسْتَغِلٌّ، وَلَا طَالِبًا لِلْعِلْمِ مُقَصِّرٌ، وَلَا فَلَّاحِيْنَ مُتَهَاوِنُونَ، وَلَا مَالِكِيْ أَرْضٍ مُسْتَبِدُّونَ، وَلَا رَبَّاتِ بُيُوتٍ مُسْرِفَاتٍ فِي إِنْفَاقِ دَخْلِهِنَّ، وَلَا سَيِّدَاتٍ غَافِلَاتٍ عَنْ أَدَاءِ وَاجِبِهِنَّ، فَالْكُلُّ يَعْمَلُ بِجِدٍّ وَ نَشَاطٍ، شِعَارُنَا يَدٌ تَحْمِلُ السِّلَاحَ وَ يَدٌ تَبْنِي، فَلَا بَيْنَنَا كَسُولٌ وَلَا مُتَعَطِّلٌ، وَالْفَرْدُ يَعْمَلُ لِصَالِحِ الْجَمَاعَةِ، وَالْجَمَاعَةُ تَعْمَلُ لِصَالِحِ الْفَرْدِ، فَلَا الْأَثَرَةُ تُسَيْطِرُ عَلَيْنَا، وَلَا الْمَصَالِحُ الشَّخْصِيَّةُ، وَهَذَا بِلَا شَكٍّ سَيُحَقِّقُ الْأَمَلَ، وَ يُوصِلُ إِلَى الْغَايَةِ الْمَنْشُودَةِ لَا مَحَالَةَ.", "urdu": "مصر میں ایسی زندگی رواں دواں ہے جو اس سے پہلے اس میں نہیں پائی گئی، پوری زندگی خیر و برکت سے، تو تم ہر فیلڈ میں مصروف زندگی، کامل چستی اور سچا تعاون پاؤ گے، تو کوئی کاریگر بیکار نہیں ہے، کوئی کارخانہ والا استحصال کرنے والا نہیں ہے، کوئی علم کا طلب کرنے والا کوتاہی کرنے والا نہیں ہے، کسان لاپرواہ نہیں ہیں، زمین والے ظالم نہیں ہیں، گھر والیاں اپنی آمدنی کے خرچ میں فضول خرچی کرنے والی نہیں ہیں، خواتین اپنی ذمہ داریوں کی ادائیگی سے غافل نہیں ہیں، تو ہر ایک محنت اور چستی سے کام کرتا ہے، ہماری نشانی ایسا ہاتھ ہے جو ہتھیار اٹھاتا ہے اور ایسا ہاتھ ہے جو تعمیر کرتا ہے، تو ہمارے درمیان نہ کوئی سست ہے اور نہ بے کار، فرد جماعت کی بھلائی کے لیے کام کرتا ہے اور جماعت فرد کی بھلائی کے لیے کام کرتی ہے، نہ ہم پر خود غرضی مسلط ہوتی ہے اور نہ شخصی مصلحتیں، اور یہ چیز بلاشبہ عنقریب امید کو پورا کر دے گی اور یقیناً مطلوبہ مقصد تک پہنچا دے گی۔", "keywords": ["مِصْرَ", "الْمُتَدَفِّقَةَ", "الْمَنْشُودَةِ"], "difficulty": "hard"}]}, {"tamreen_no": 9, "title": "التمرین (9)", "type": "translation", "instruction": "اردو میں ترجمہ کرو۔", "total_questions": 15, "questions": [{"id": 1, "arabic": "أُحِبُّ تَسَلُّقَ الْجِبَالِ وَلَا سِيَّمَا الشَّاهِقَةِ.", "urdu": "مجھے پہاڑوں کی چڑھائی پسند ہے خاص کر بلند پہاڑوں کی۔", "keywords": ["تَسَلُّقَ", "الْجِبَالِ", "الشَّاهِقَةِ"], "difficulty": "medium"}, {"id": 2, "arabic": "يُنْفِقُ الْعَاقِلُ مَالَهُ فِي وُجُوهِ الْخَيْرِ وَلَا سِيَّمَا مُسَاعَدَةِ الْفُقَرَاءِ.", "urdu": "عقلمند اپنا مال بھلائی کے راستوں میں خرچ کرتا ہے خصوصاً فقیروں کی مدد کرنے میں۔", "keywords": ["يُنْفِقُ", "الْعَاقِلُ", "الْفُقَرَاءِ"], "difficulty": "medium"}, {"id": 3, "arabic": "يُكَافَأُ الْمُجِدُّونَ وَلَا سِيَّمَا مُجِدٌّ خُلُقُهُ كَرِيمٌ.", "urdu": "محنتی لوگوں کو بدلہ دیا جاتا ہے بالخصوص اس محنتی کو جس کے اخلاق اچھے ہوں۔", "keywords": ["يُكَافَأُ", "الْمُجِدُّونَ", "كَرِيمٌ"], "difficulty": "medium"}, {"id": 4, "arabic": "أُحِبُّ سُكْنَى الْقُرَى وَلَا سِيَّمَا قَرْيَةً بِوِلَايَةِ كَشْمِيرَ.", "urdu": "میں گاؤں کی رہائش پسند کرتا ہوں خاص طور پر صوبہ کشمیر کے گاؤں کی رہائش۔", "keywords": ["سُكْنَى", "الْقُرَى", "كَشْمِيرَ"], "difficulty": "medium"}, {"id": 5, "arabic": "رَبِحَ تُجَّارُ الْمَدِينَةِ وَلَا سِيَّمَا تُجَّارُ الْقُطْنِ.", "urdu": "شہر کے تاجروں نے فائدہ اٹھایا خاص طور پر روئی کے تاجروں نے۔", "keywords": ["رَبِحَ", "تُجَّارُ", "الْقُطْنِ"], "difficulty": "medium"}, {"id": 6, "arabic": "يَضُرُّ السَّهَرُ كُلَّ طِفْلٍ وَلَا سِيَّمَا طِفْلٌ جِسْمُهُ ضَعِيفٌ.", "urdu": "بے خوابی ہر بچہ کو نقصان دیتی ہے بالخصوص اس بچہ کو جس کا جسم کمزور ہے۔", "keywords": ["السَّهَرُ", "طِفْلٌ", "ضَعِيفٌ"], "difficulty": "medium"}, {"id": 7, "arabic": "زُرْتُ حَدِيقَةً فَزَاعَنِي كُلُّ شَيْءٍ لَا سِيَّمَا حُسْنُ الْوُرُودِ الْمُخْتَلِفَةِ الْأَلْوَانِ.", "urdu": "میں نے ایک باغ کی سیر کی تو مجھے ہر چیز نے خوش کر دیا بالخصوص مختلف رنگوں کے پھولوں کی خوبصورتی نے۔", "keywords": ["حَدِيقَةً", "الْوُرُودِ", "الْأَلْوَانِ"], "difficulty": "hard"}, {"id": 8, "arabic": "إِسْتَشِيْرِ الْأَصْدِقَاءَ وَلَا سِيَّمَا صَدِيْقًا عَاقِلًا.", "urdu": "دوستوں سے مشورہ کر خاص طور پر عقل مند دوست سے۔", "keywords": ["إِسْتَشِيْرِ", "الْأَصْدِقَاءَ", "عَاقِلًا"], "difficulty": "medium"}, {"id": 9, "arabic": "الْفَاكِهَةُ غِذَاءٌ مُفِيْدٌ وَلَا سِيَّمَا الْبُرْتُقَالُ.", "urdu": "میوہ فائدہ مند غذا ہے بالخصوص سنترا۔", "keywords": ["الْفَاكِهَةُ", "غِذَاءٌ", "الْبُرْتُقَالُ"], "difficulty": "easy"}, {"id": 10, "arabic": "اِسْتَمْتَعْتُ بِقِرَاءَةِ هَذَا الدِّيْوَانِ وَلَا سِيَّمَا هَاتَيْنِ الْقَصِيْدَتَيْنِ.", "urdu": "میں نے اس دیوان کا پڑھنا غور سے سنا خاص طور پر یہ دو قصیدے۔", "keywords": ["اِسْتَمْتَعْتُ", "الدِّيْوَانِ", "الْقَصِيْدَتَيْنِ"], "difficulty": "hard"}, {"id": 11, "arabic": "كَثْرَةُ الْأَكْلِ تَضُرُّ الْأَجْسَامَ وَلَا سِيَّمَا الْمِعْدَةَ.", "urdu": "زیادہ کھانا جسموں کو نقصان دیتا ہے خاص طور پر معدہ کو۔", "keywords": ["كَثْرَةُ", "الْأَجْسَامَ", "الْمِعْدَةَ"], "difficulty": "medium"}, {"id": 12, "arabic": "اِتَّقُوا الْمُزَاحَ وَلَا سِيَّمَا مُزَاحٌ يُؤَدِّي إِلَى الْخِصَامِ.", "urdu": "مذاق سے پرہیز کرو بالخصوص ایسی مذاق سے جو جھگڑے کا سبب بنتی ہو۔", "keywords": ["اِتَّقُوا", "الْمُزَاحَ", "الْخِصَامِ"], "difficulty": "medium"}, {"id": 13, "arabic": "طَالِعُوا الْكُتُبَ فِي الْإِجَازَةِ السَّنَوِيَّةِ وَلَا سِيَّمَا كُتُبَ الْأَدَبِ.", "urdu": "سالانہ چھٹی میں کتابوں کا مطالعہ کرو خاص طور پر ادب کی کتابوں کا۔", "keywords": ["طَالِعُوا", "الْإِجَازَةِ", "الْأَدَبِ"], "difficulty": "medium"}, {"id": 14, "arabic": "أَلْقَى رَئِيْسُ الْجَامِعَةِ الْأَشْرَفِيَّةِ مُحَاضَرَةً فَاسْتَفَادَ مِنْهَا جَمِيْعُ الطُّلَّابِ وَلَا سِيَّمَا هَاشِمٌ.", "urdu": "الجامعۃ الاشرفیہ کے پرنسپل نے ایک لکچر دیا جس سے تمام طلبہ نے فائدہ حاصل کیا خاص کر ہاشم نے۔", "keywords": ["الْجَامِعَةِ", "مُحَاضَرَةً", "فَاسْتَفَادَ"], "difficulty": "hard"}, {"id": 15, "arabic": "ذَهَبْتُ إِلَى الْمُسْتَشْفَى وَعُدْتُ الْمَرْضَى وَلَا سِيَّمَا جَارِي حَامِدٌ.", "urdu": "میں ہاسپٹل گیا اور مریضوں کی عیادت کی بالخصوص اپنے پڑوسی حامد کی۔", "keywords": ["الْمُسْتَشْفَى", "الْمَرْضَى", "جَارِي"], "difficulty": "hard"}]}, {"tamreen_no": 10, "title": "التمرین (10)", "type": "translation", "instruction": "عربی میں ترجمہ کرو۔", "total_questions": 13, "questions": [{"id": 1, "arabic": "أُسَاعِدُ الطُّلَّابَ مِنَ الْمَدَارِسِ الدِّيْنِيَّةِ وَلَا سِيَّمَا الْمُجِدُّونَ.", "urdu": "میں دینی مدارس کے طلبہ کی مدد کرتا ہوں، خصوصاً محنتی طلبہ کی۔", "keywords": ["أُسَاعِدُ", "الْمَدَارِسِ", "الْمُجِدُّونَ"], "difficulty": "medium"}, {"id": 2, "arabic": "قَبَضَ الْبُوْلِيْسُ عَلَى الْقُطَّاعِ وَعَاقَبَهُمْ وَلَا سِيَّمَا سَيِّدَهُمْ.", "urdu": "پولیس نے ڈاکوؤں کو گرفتار کیا اور انہیں سزا دی، خصوصاً ان کے سردار کو۔", "keywords": ["الْبُوْلِيْسُ", "الْقُطَّاعِ", "سَيِّدَهُمْ"], "difficulty": "hard"}, {"id": 3, "arabic": "أَعْجَبَنِي غُرُفَاتُ بَيْتِكَ وَلَا سِيَّمَا قَاعَةُ الْإِسْتِقْبَالِ.", "urdu": "مجھے تمہارے گھر کے کمرے پسند آئے، بالخصوص نشست کا کمرہ۔", "keywords": ["أَعْجَبَنِي", "غُرُفَاتُ", "قَاعَةُ"], "difficulty": "medium"}, {"id": 4, "arabic": "تَسِيْرُ الْقُطُرُ بِسُرْعَةٍ فَائِقَةٍ وَلَا سِيَّمَا الْقُطُرُ الَّتِي تَسِيْرُ بِالْكَهْرُبَاءِ.", "urdu": "ریل گاڑیاں بڑی برق رفتاری سے چلتی ہیں، خصوصاً بجلی سے چلنے والی۔", "keywords": ["الْقُطُرُ", "بِسُرْعَةٍ", "الْكَهْرُبَاءِ"], "difficulty": "hard"}, {"id": 5, "arabic": "يَأْكُلُ مَحْمُوْدٌ الْفَوَاكِهَ كُلَّهَا، وَلَا سِيَّمَا الْأَنْبَجَ وَالْبُرْتُقَالَ.", "urdu": "محمود سارے پھل کھاتا ہے، خصوصاً آم اور سنترا۔", "keywords": ["مَحْمُوْدٌ", "الْأَنْبَجَ", "الْبُرْتُقَالَ"], "difficulty": "medium"}, {"id": 6, "arabic": "جَلَّدْتُمْ جَمِيْعَ الْكُتُبِ وَلَا سِيَّمَا الْكُتُبَ الْقَدِيْمَةَ.", "urdu": "تم لوگوں نے ساری کتابوں کی جلد سازی کی، خصوصاً پرانی کتابوں کی۔", "keywords": ["جَلَّدْتُمْ", "الْكُتُبِ", "الْقَدِيْمَةَ"], "difficulty": "medium"}, {"id": 7, "arabic": "طَالِعُوا الْكُتُبَ الْإِسْلَامِيَّةَ فِي الْإِجَازَةِ السَّنَوِيَّةِ وَلَا سِيَّمَا الْكُتُبَ الْفِقْهِيَّةَ.", "urdu": "سالانہ چھٹی میں اسلامی کتابوں کا مطالعہ کرو اور خاص طور پر فقہی کتابوں کا۔", "keywords": ["طَالِعُوا", "الْإِجَازَةِ", "الْفِقْهِيَّةَ"], "difficulty": "hard"}, {"id": 8, "arabic": "صَنَّفَ الْإِمَامُ أَحْمَد رِضَا الْقَادِرِيُّ الْبَرَيْلَوِيُّ الْكُتُبَ فِي الْعُلُوْمِ الْمُخْتَلِفَةِ وَلَا سِيَّمَا فِي عِلْمِ الْفِقْهِ.", "urdu": "امام احمد رضا قادری بریلوی نے مختلف علوم وفنون میں کتابیں لکھیں، خصوصاً علم فقہ میں۔", "keywords": ["صَنَّفَ", "الْعُلُوْمِ", "الْفِقْهِ"], "difficulty": "hard"}, {"id": 9, "arabic": "جَمِيْعُ الْمُؤَلَّفَاتِ لِلْإِمَامِ الْغَزَالِيِّ مُفِيْدَةٌ وَلَا سِيَّمَا \"إِحْيَاءُ عُلُوْمِ الدِّيْنِ\".", "urdu": "امام غزالی کی تمام تصنیفات مفید ہیں، اور خاص طور پر \"احیاء علوم الدین\"۔", "keywords": ["الْمُؤَلَّفَاتِ", "مُفِيْدَةٌ", "إِحْيَاءُ"], "difficulty": "hard"}, {"id": 10, "arabic": "أَصْلَحَ الْغَوْثُ الْأَعْظَمُ الشَّيْخُ عَبْدُ الْقَادِرِ الْجِيْلَانِيُّ عَلَيْهِ الرَّحْمَةُ الْمُجْتَمَعَ الْفَاسِدَ بِمَوَاهِبِهِ وَلَا سِيَّمَا بِخُطَبِهِ الْمُؤَثِّرَةِ.", "urdu": "غوث اعظم شیخ عبدالقادر جیلانی علیہ الرحمہ نے اپنی خداداد صلاحیتوں سے بگڑے ہوئے معاشرے کی اصلاح کی، خصوصاً اپنی موثر تقریروں کے ذریعے۔", "keywords": ["أَصْلَحَ", "الْمُجْتَمَعَ", "الْمُؤَثِّرَةِ"], "difficulty": "hard"}, {"id": 11, "arabic": "يَرَى النَّاسُ الْهِلَالَ وَلَا سِيَّمَا هِلَالَ عِيْدِ الْفِطْرِ.", "urdu": "لوگ نیا چاند دیکھتے ہیں اور خاص طور سے عید الفطر کا چاند۔", "keywords": ["الْهِلَالَ", "عِيْدِ الْفِطْرِ"], "difficulty": "medium"}, {"id": 12, "arabic": "دَارَ الْمُفَتِّشُ الْمَدَارِسَ الرَّسْمِيَّةَ وَلَا سِيَّمَا مَدْرَسَةَ قَرْيَتِي.", "urdu": "انسپکٹر نے سرکاری اسکولوں کا دورہ کیا، خاص طور سے میرے گاؤں کے اسکول کا۔", "keywords": ["الْمُفَتِّشُ", "الرَّسْمِيَّةَ", "قَرْيَتِي"], "difficulty": "hard"}, {"id": 13, "arabic": "يُكْرِمُ الْوِلْدَانُ الْمُجِدُّوْنَ كِبَارَهُمْ وَلَا سِيَّمَا الْوَالِدَيْنِ وَالْأَسَاتِذَةَ.", "urdu": "اچھے لڑکے اپنے بڑوں کا احترام کرتے ہیں، اور خاص طور سے والدین اور اساتذہ کا۔", "keywords": ["الْوِلْدَانُ", "كِبَارَهُمْ", "الْوَالِدَيْنِ"], "difficulty": "hard"}]}, {"tamreen_no": 11, "title": "التمرین (11)", "type": "translation", "instruction": "اردو میں ترجمہ کرو۔", "total_questions": 20, "questions": [{"id": 1, "arabic": "رَأَيْتُ الْقَمَرَ مُضِيْئًا.", "urdu": "میں نے چاند کو روشن جانا۔", "keywords": ["رَأَيْتُ", "الْقَمَرَ", "مُضِيْئًا"], "difficulty": "easy"}, {"id": 2, "arabic": "عَلِمْتُكَ صَادِقَ الْوُدِّ.", "urdu": "میں نے تجھے سچی محبت والا جانا۔", "keywords": ["عَلِمْتُكَ", "صَادِقَ", "الْوُدِّ"], "difficulty": "easy"}, {"id": 3, "arabic": "زَعَمَ سُهَيْلٌ عَامِرًا طَبِيْبًا.", "urdu": "سہیل نے عامر کو طبیب گمان کیا۔", "keywords": ["زَعَمَ", "عَامِرًا", "طَبِيْبًا"], "difficulty": "easy"}, {"id": 4, "arabic": "ظَنَنْتُكَ مُقَصِّرًا فِي عَمَلِكَ.", "urdu": "میں نے تجھے اپنے کام میں کوتاہی کرنے والا پایا۔", "keywords": ["ظَنَنْتُكَ", "مُقَصِّرًا", "عَمَلِكَ"], "difficulty": "easy"}, {"id": 5, "arabic": "وَجَدْتُ كَلَامَكَ مَعْسُوْلًا.", "urdu": "میں نے تیرے کلام کو شیریں پایا۔", "keywords": ["وَجَدْتُ", "كَلَامَكَ", "مَعْسُوْلًا"], "difficulty": "easy"}, {"id": 6, "arabic": "لَا تَظُنَّ سُكُوْتِي عَجْزًا.", "urdu": "میرے خاموشی کو مجبوری گمان نہ کر۔", "keywords": ["تَظُنَّ", "سُكُوْتِي", "عَجْزًا"], "difficulty": "easy"}, {"id": 7, "arabic": "أَعُدُّ زِيَارَتَكَ لَنَا الْيَوْمَ عِيْدًا.", "urdu": "میں آج تیری ملاقات کو اپنے لیے عید سمجھتا ہوں۔", "keywords": ["أَعُدُّ", "زِيَارَتَكَ", "عِيْدًا"], "difficulty": "easy"}, {"id": 8, "arabic": "حَسِبْتُ أَنَّ سَيَصِيْرُ الْحَقُّ سَائِدًا.", "urdu": "میرا گمان ہے کہ حق عام ہو جائے گا۔", "keywords": ["حَسِبْتُ", "الْحَقُّ", "سَائِدًا"], "difficulty": "medium"}, {"id": 9, "arabic": "يُخَالُ الْجَبَانُ فِرَارَهُ مُطِيْلًا لِعُمْرِهِ.", "urdu": "بزدل اپنے بھاگنے کو اپنی عمر کو دراز کرنے والا گمان کرتا ہے۔", "keywords": ["الْجَبَانُ", "فِرَارَهُ", "لِعُمْرِهِ"], "difficulty": "hard"}, {"id": 10, "arabic": "عَلِمَ الْمُدَرِّسُ الطُّلَّابَ فَاهِمِيْنَ.", "urdu": "استاد نے طلبہ کو سمجھنے والا گمان کیا۔", "keywords": ["الْمُدَرِّسُ", "الطُّلَّابَ", "فَاهِمِيْنَ"], "difficulty": "medium"}, {"id": 11, "arabic": "وَجَدْتُ الدِّرَاسَاتِ الْحُرَّةَ فِي الْعُطْلَةِ نَافِعَةً لِلْغَايَةِ.", "urdu": "میں نے آزاد مطالعہ کو چھٹی کے دنوں میں بے حد نفع بخش پایا۔", "keywords": ["الدِّرَاسَاتِ", "الْعُطْلَةِ", "نَافِعَةً"], "difficulty": "hard"}, {"id": 12, "arabic": "دَرَيْتُ الْعِلْمَ نَافِعًا وَالْجَهْلَ ضَارًّا.", "urdu": "میں نے علم کو نفع بخش اور جہل کو نقصان دہ جانا۔", "keywords": ["دَرَيْتُ", "الْعِلْمَ", "الْجَهْلَ"], "difficulty": "medium"}, {"id": 13, "arabic": "هَبْ نَفْسَكَ صَاحِبَ الْقَضِيَّةِ ثُم| تَصَرَّفْ.", "urdu": "خود کو مقدمہ والا سمجھ پھر تصرف کر۔", "keywords": ["نَفْسَكَ", "الْقَضِيَّةِ", "تَصَرَّفْ"], "difficulty": "hard"}, {"id": 14, "arabic": "يُظَنُّ أَنَّ أَوَّلَ مَنْ تَكَلَّمَ الْعَرَبِيَّةَ يَعْرُبُ بْنُ قَحْطَانَ.", "urdu": "پہلی مرتبہ عربی میں بات کرنے والے کو یعرب بن قحطان گمان کیا جاتا ہے۔", "keywords": ["تَكَلَّمَ", "الْعَرَبِيَّةَ", "يَعْرُبُ"], "difficulty": "hard"}, {"id": 15, "arabic": "وَجَدْتُ أَنَّ الْإِسْلَامَ سَبَقَ الْعَالَمَ فِي إِعْلَانِ حُقُوقِ الْإِنْسَانِ.", "urdu": "میں نے پایا کہ اسلام انسان کے حقوق کا اعلان کرنے میں دنیا سے بڑھ گیا۔", "keywords": ["الْإِسْلَامَ", "حُقُوقِ", "الْإِنْسَانِ"], "difficulty": "hard"}, {"id": 16, "arabic": "تَرَى أَنَّ الطُّفُولَةَ صَانِعَةُ الْمُسْتَقْبَلِ وَأَنَّ رِعَايَةَ الْأَطْفَالِ ضَمَانٌ لِلنَّهْضَةِ وَالتَّقَدُّمِ.", "urdu": "ہم سمجھتے ہیں کہ بچپن مستقبل کو سنوارنے والا ہے، اور بچوں کی نگرانی بیداری اور ترقی کی ضامن ہے۔", "keywords": ["الطُّفُولَةَ", "الْمُسْتَقْبَلِ", "ضَمَانٌ"], "difficulty": "hard"}, {"id": 17, "arabic": "لَتَجِدَنَّ أَشَدَّ النَّاسِ عَدَاوَةً لِلَّذِينَ آمَنُوا الْيَهُودَ وَالَّذِينَ أَشْرَكُوا وَلَتَجِدَنَّ أَقْرَبَهُمْ مَوَدَّةً لِلَّذِينَ آمَنُوا الَّذِينَ قَالُوا إِنَّا نَصَارَى.", "urdu": "ضرور تم مسلمانوں کا سب سے بڑھ کر دشمن یہودیوں اور مشرکوں کو پاؤ گے اور ضرور تم مسلمانوں کی دوستی میں سب سے زیادہ قریب ان کو پاؤ گے جو کہتے تھے ہم نصاریٰ ہیں۔", "keywords": ["عَدَاوَةً", "الْيَهُودَ", "نَصَارَى"], "difficulty": "hard"}, {"id": 18, "arabic": "وَلَا تَحْسَبَنَّ اللهَ غَافِلًا عَمَّا يَعْمَلُ الظَّالِمُونَ.", "urdu": "اور ہرگز اللہ کو بے خبر نہ جاننا ظالموں کے کام سے۔", "keywords": ["تَحْسَبَنَّ", "غَافِلًا", "الظَّالِمُونَ"], "difficulty": "medium"}, {"id": 19, "arabic": "وَتَرَى كَثِيرًا مِنْهُمْ يُسَارِعُونَ فِي الْإِثْمِ وَالْعُدْوَانِ.", "urdu": "اور ان میں سے تم اکثر کو دیکھو گے کہ گناہ اور زیادتی اور حرام خوری پر دوڑتے ہیں۔", "keywords": ["يُسَارِعُونَ", "الْإِثْمِ", "الْعُدْوَانِ"], "difficulty": "hard"}, {"id": 20, "arabic": "ظَنَنْتُمْ أَنَّ اللهَ لَا يَعْلَمُ كَثِيرًا مِمَّا تَعْمَلُونَ.", "urdu": "تم تو سمجھ بیٹھے تھے کہ اللہ تمہارے بہت سے کام نہیں جانتا۔", "keywords": ["ظَنَنْتُمْ", "يَعْلَمُ", "تَعْمَلُونَ"], "difficulty": "medium"}]}, {"tamreen_no": 12, "title": "التمرین (12)", "type": "translation", "instruction": "عربی میں ترجمہ کرو۔", "total_questions": 16, "questions": [{"id": 1, "arabic": "ظَنَّ عَامِرٌ السَّرَابَ اللَّامِعَ مَاءً.", "urdu": "عامر نے چمکتے ہوئے سراب کو پانی سمجھا۔", "keywords": ["عَامِرٌ", "السَّرَابَ", "مَاءً"], "difficulty": "easy"}, {"id": 2, "arabic": "حَسِبَ عُلَمَاءُ الطَّبِيْعَةِ أَنَّ الْأَرْضَ تَدُوْرُ حَوْلَ الشَّمْسِ.", "urdu": "سائنس دانوں کا گمان ہے کہ زمین، سورج کے گرد چکر لگاتی ہے۔", "keywords": ["عُلَمَاءُ", "الْأَرْضَ", "تَدُوْرُ"], "difficulty": "medium"}, {"id": 3, "arabic": "كَانَ الْإِمَامُ أَحْمَد رِضَا الْبَرَيْلَوِيُّ يَرَى حُبَّ الرَّسُولِ رَأْسَ الْإِيْمَانِ.", "urdu": "امام احمد رضا بریلوی عشق رسول کو روح ایمان سمجھتے تھے۔", "keywords": ["الْبَرَيْلَوِيُّ", "يَرَى", "الْإِيْمَانِ"], "difficulty": "hard"}, {"id": 4, "arabic": "إِعْلَمُوا أَنَّ الرِّ يَا وَالْمُظَاهَرَةَ يُحْرِقُ الْأَعْمَالُ الصَّالِحَةُ فَيُحَوِّلُهَا إِلَى الرَّمَادِ.", "urdu": "یہ یقین جانو کہ ریا اور دکھاوا اعمال صالحہ کو جلا کر راکھ کر دیتا ہے۔", "keywords": ["الرِّ يَا", "الْمُظَاهَرَةَ", "الرَّمَادِ"], "difficulty": "hard"}, {"id": 5, "arabic": "هَبْ أَنَّ جَارَكَ شِرِّيْرٌ فَأَحْسِنْ إِلَيْهِ.", "urdu": "مان لو کہ تمہارا پڑوسی شریر ہے، پھر بھی اس کے ساتھ اچھا سلوک کرو۔", "keywords": ["هَبْ", "جَارَكَ", "شِرِّيْرٌ"], "difficulty": "medium"}, {"id": 6, "arabic": "لَا يَسْتَكْبِرُ عِبَادُ اللهِ الصَّالِحُوْنَ وَلَا يَحْسَبُوْنَ أَنْفُسَهُمْ خَيْرًا مِنَ الْآخَرِيْنَ.", "urdu": "اللہ کے نیک بندے تکبر نہیں کرتے اور خود کو دوسروں سے برتر نہیں جانتے۔", "keywords": ["يَسْتَكْبِرُ", "يَحْسَبُوْنَ", "الْآخَرِيْنَ"], "difficulty": "hard"}, {"id": 7, "arabic": "سَقَطَتْ فَنَاجِيْنُ الشَّايِ مِنْ يَدِ الْجَارِيَةِ عَلَى الْأَرْضِ وَظَنَّتْ أَنَّهَا كُسِرَتْ.", "urdu": "خادمہ کے ہاتھ سے چائے کی پیالیاں زمین پر گریں اور اس نے سمجھا کہ وہ ٹوٹ گئیں۔", "keywords": ["فَنَاجِيْنُ", "الْجَارِيَةِ", "كُسِرَت|"], "difficulty": "hard"}, {"id": 8, "arabic": "يَحْسَبُ بَع| بَعْضُ الطُّلَّابِ مِنَ الْمَدَارِسِ الْحُكُوْمِيَّةِ أَنْفُسَهُمْ أَحْرَارًا مِنَ الْقَوَانِيْنِ الدِّرَاسِيَّةِ.", "urdu": "سرکاری اسکول کے کچھ طلبہ اپنے آپ کو تمام تعلیمی قوانین سے آزاد سمجھتے ہیں۔", "keywords": ["الْمَدَارِسِ", "ال| الْحُكُوْمِيَّةِ", "أَحْرَارًا"], "difficulty": "hard"}, {"id": 9, "arabic": "إِخْدِمُوا الْوَالِدَيْنِ وَعُدُّوْهُمَا نِعْمَةَ اللهِ.", "urdu": "والدین کی خدمت کرو اور انہیں اللہ کی نعمت سمجھو۔", "keywords": ["إِخْدِمُوا", "الْوَالِدَيْنِ", "نِعْمَةَ"], "difficulty": "medium"}, {"id": 10, "arabic": "إِشْتَرَى سَمِيْرٌ الْأَحْذِيَةَ فِي سُوْقِ كَانْفُوْرَ وَظَنَّهَا مَصْنُوْعَةً مِنَ الْجِلْدِ.", "urdu": "سمیر نے کانپور کے بازار میں جوتے خریدے اور انہیں چمڑے کا بنا ہوا گمان کیا۔", "keywords": ["الْأَحْذِيَةَ", "كَانْفُوْرَ", "الْجِلْدِ"], "difficulty": "hard"}, {"id": 11, "arabic": "يُعَدُّ الْكَهْرُبَاءُ وَالْحَاسُوْبُ لِكُلِّ دَائِرَةٍ وَدُكَّانٍ كَبِيْرٍ ضَرُوْرِيًّا فِي هَذَا الْعَصْرِ.", "urdu": "اس وقت بجلی اور کمپیوٹر ہر آفس اور بڑی دکان کے لیے ضروری سمجھا جاتا ہے۔", "keywords": ["الْكَهْرُبَاءُ", "الْحَاسُوْبُ", "الْعَصْرِ"], "difficulty": "hard"}, {"id": 12, "arabic": "ظَنَنْتُ إِطَارَ النَّظَّارَةِ مَتِيْنًا وَقَد| وَقَدْ كَانَ وَاهِنًا جِدًّا.", "urdu": "میں نے چشمے کے فریم کو مضبوط سمجھا، جب کہ وہ نہایت کمزور نکلا۔", "keywords": ["إِطَارَ", "النَّظَّارَةِ", "وَاهِنًا"], "difficulty": "hard"}, {"id": 13, "arabic": "ظَنَّ الْبُوْلِيْسُ الْجَالِسِيْنَ سَارِقِيْنَ فِي ظُلْمَةِ اللَّيْلِ وَ قَبَضَ عَلَيْهِمَا.", "urdu": "پولیس نے رات کے اندھیرے میں بیٹھنے والے دو آدمیوں کو چور سمجھا اور گرفتار کر لیا۔", "keywords": ["الْبُوْلِيْسُ", "سَارِقِيْنَ", "قَبَضَ"], "difficulty": "hard"}, {"id": 14, "arabic": "مَنْ عَلِمَ بِالْجَزْمِ أَنَّهُ مُلَاقِي اللهِ بَعْدَ الْمَوْتِ يَمْتَثِلُ الْأَحْكَامَ الشَّرْعِيَّةَ.", "urdu": "جو یقین کے ساتھ جانتا ہے کہ مجھے مرنے کے بعد اللہ تعالیٰ سے ملنا ہے وہ شرعی احکام کی بجا آوری کرتا ہے۔", "keywords": ["مُلَاقِي", "الْمَوْتِ", "الْأَحْكَامَ"], "difficulty": "hard"}, {"id": 15, "arabic": "يَرَى أَهْلُ السُّنَّةِ مِنَ الْعَالَمِ كُلِّهِ سَيِّدَنَا الشَّيْخَ عَبْدَ الْقَادِرِ الْجِيْلَانِيَّ رَحْمَةُ اللهِ عَلَيْهِ سُلْطَانَ الْأَوْلِيَاءِ الْكِرَامِ.", "urdu": "دنیا بھر کے اہل سنت سیدنا شیخ عبدالقادر جیلانی رحمتہ اللہ تعالیٰ علیہ کو اولیائے کرام کا سردار سمجھتے ہیں۔", "keywords": ["السُّنَّةِ", "الْجِيْلَانِيَّ", "سُلْطَانَ"], "difficulty": "hard"}, {"id": 16, "arabic": "نَصَحَ رَئِيْسُ الْجَامِعَةِ الْمُتَخَرِّجِيْنَ مِنْ صَفِّ الْفَضِيْلَةِ وَقَالَ: اِعْمَلُوْا عَمَلَ التَّدْرِيْسِ خَالِصًا لِوَجْهِ اللهِ بِجِدٍّ وَشَغَفٍ كَامِلٍ وَعُدُّوْا مَا تَيَسَّرَ مِنَ الرَّاتِبِ جَائِزَةً لَكُمْ.", "urdu": "حضرت شیخ الجامعہ نے درجہ فضیلت سے فارغ ہونے والوں کو نصیحت کی اور فرمایا: تدریس کا کام پوری محنت اور لگن کے ساتھ صرف اللہ تعالیٰ کی خوشنودی کے لیے کرو اور تنخواہ کے نام پر جو ملے اسے انعام سمجھو۔", "keywords": ["الْجَامِعَةِ", "التَّدْرِيْسِ", "الرَّاتِبِ"], "difficulty": "hard"}]}, {"tamreen_no": 13, "title": "التَّمْرِينُ (١٣)", "type": "ترجمہ اور اعراب", "instruction": "اعراب لگاؤ اور اردو میں ترجمہ کرو۔", "total_questions": 6, "questions": [{"id": 1, "arabic": "إِذَا هَبْطْتَ مَدِينَةً مِنَ الْمُدْنِ ، أَوْ ذَهَبْتَ إِلَى قَرْيَةٍ مِنَ الْقُرَى تَجِدُ أَبْنَاءَهَا خَادِمِينَ وَتَخْدُوْمِينَ ، كُلُّ وَاحِدٍ مِنْهُمْ عُضْوٌ فِي الْمُجْتَمَعِ الَّذِي يَعِيشُ فِيهِ ، وَخَادِمٌ لِأَخِيهِ ، وَإِنْ كَانَ يَبْدُوْ فِي الظَّاهِرِ أَنَّهُ لَا يَخْدَمُ إِلَّا نَفْسَهُ .", "urdu": "جب تم کسی شہر میں اترو یا کسی گاؤں میں جاؤ گے تو اس کے باشندوں کو تم خدمت گار و نوکر پاؤ گے ، ان میں سے ہر ایک اس معاشرہ کا ایک فرد ہے جس میں وہ زندگی گزارتا ہے ، اپنے بھائی کا خادم ہے اگر چہ بظاہر ایسا لگتا ہے کہ وہ صرف اپنے آپ کا خادم ہے۔", "keywords": ["شہر", "گاؤں", "خدمت گار", "معاشرہ", "خادم"], "difficulty": "medium"}, {"id": 2, "arabic": "فَسَيَّارَةُ الأَجْرَةِ الْمُنْتَظِرَةُ فِي مَوْقِفِهَا تَخْدِمُ سَائِقَهَا وَتَخْدِمُ رَاكِبَهَا ، وَالْعَامِلُ فِي مَصْنَعِه يَخْدَمُ نَفْسَهُ وَيَخْدَمُ غَيْرَهُ ، وَالتَّاجِرُ فِي مَتْجَرِهِ وَاللَّاعِبُ فِي مَلْعَبِهِ وَالصَّحْفِي فِي مَكْتَبِهِ ، وَالْعَالِمُ فِي مَعْمَلِهِ ... وَهُكَذَ نَجِدُ كُلَّ إِنْسَانٍ خَادِمًا وَمَخْدُوْمًا .", "urdu": "موٹر اسٹینڈ میں موجود کرایہ کی گاڑی اپنے ڈرائیور اور اپنے سوار کی خدمت کرتی ہے ، مزدور اپنے کارخانہ میں اپنی اور دوسرے کی مدد کرتا ہے ، تاجر اپنی دکان میں ، کھلاڑی اپنے میدان میں ، صحافی اپنے آفس میں سائنس داں اپنے لیب میں خود کی خدمت کرتا ہے اور اسی طرح ہم ہر انسان کو خدمت گار اور نوکر پاتے ہیں۔", "keywords": ["موٹر اسٹینڈ", "ڈرائیور", "مزدور", "تاجر", "خلاڑی"], "difficulty": "medium"}, {"id": 3, "arabic": "هُوَ لَوْنٌ جَدِيدٌ مِنَ الْمُحَارِ بِيْنَ لَيْسَ لَهُ مَثِيلٌ بَيْنَ الْجُيُوشِ فِي الْعَالَمَ فِي الْعَصْرِ الْحَدِيْثِ . وَ يَتَأَلَّفُ مِنْ مَجْمُوعَاتٍ كَبِيرَةٍ مِنْ رِجَالِ الْقَبَائِلِ الْعَرَبِيَّةِ الْمُخْتَتَلِفَةِ الَّذِيْنَ نَذَرُوْا أَنْفُسَهُمْ لِلْجِهَادِ فِي سَبِيلِ اللَّهِ .", "urdu": "وہ جنگجوؤں کی ایک نئی قسم ہے جس کی نظیر دور حاضر میں دنیا کی فوجوں کے درمیان نہیں ہے، اور وہ مختلف عربی قبیلوں کے مردوں کی بڑی تعداد پر مشتمل ہے جنھوں نے اپنے آپ کو اللہ کی راہ میں جہاد کے لیے وقف کر دیا۔", "keywords": ["جنگجو", "فوج", "عربی قبیلہ", "جہاد"], "difficulty": "medium"}, {"id": 4, "arabic": "وَ يَتَمَيَّزُ أَفْرَادُ هَذَا الْجَيْشِ بِمَظَاهِرَ كَثِيرَةٍ ، مِنْهَا تَمَسُّكُهُمْ بِمَلَابِسِهِمْ الْعَرَبِيَّةِ الأَصْلِيَّهِ وَعَدْمِ اِرْتِدَاهِمْ الزَيَّ الْعَسْكَرِيِّ وَمِنْهَا أَنَّهُ لَا تَجْمَعُ بَيْنَ أَفْرَادِهِ مِنْ مُعَيَّنَةٌ ، فَنَجِدُ بَيْنَ صُفُوفِهِ الْغُلَامَ اليَافِعَ ، وَالشَّابَ الْقَوِيُّ ، وَالْكَهْلَ الصَّارِمَ ، وَالشَّيْخَ الْعَجُوْزَ.", "urdu": "اس فوج کے افراد بہت سی شکلوں سے ممتاز ہوتے ہیں ان میں ایک یہ ہے کو وہ اپنے اصلی عربی لباس میں ملبوس رہتے ہیں اور فوجی ڈریس نہیں پہنتے ہیں، ان میں سے ایک یہ ہے کہ اس فوج کے افراد کے درمیان متعین عمر نہیں ہوتی ہے تو ہم ان کی صفوں میں نوخیز لڑکا ، طاقت ور جوان، بہادر ادھیڑ اور بے بس بوڑھا بھی پاتے ہیں۔", "keywords": ["فوج", "عربی لباس", "جوان", "بوڑھا"], "difficulty": "hard"}, {"id": 5, "arabic": "هؤُلَاءِ الْجُنُودُ وَإِنْ تَفَاوَتُوْا فِي السِّنِّ - لَا تَجِدُ بَيْنَهُمْ تَفَاوُتَ فِي الشَّجَاعَةِ وَالإِقْدَامِ ، فَقَدْ وَخَدَتْ بَيْنَهُمْ الْعَقِيدَةُ السَّلِيْمَةُ ، وَرَبَطَتْ بَيْنَهُمْ الشَّجَاعَةُ الْمُتَحَدِرَةُ فِي دِمَائِهِمْ عَبْرَ مِئَاتِ السِّنِينَ مِنْ جَدُوْدِهِمُ الْمَغَاوِيْنِ.", "urdu": "یہ فوجیں اگر چہ عمر میں مختلف ہوں لیکن تم ان کے درمیان بہادری پیش قدمی میں کوئی فرق نہ پاؤ گے ، کیوں کہ درست عقیدے نے انھیں آپس میں ایک بنا دیا ہے ، بہادر آبا و اجداد سے ملنے والی بہادری نے ان کو جوڑ دیا ہے جو صدیوں سے ان کے خونوں میں گردش کر رہی ہے۔", "keywords": ["فوج", "بہادری", "عقیدہ", "آبا و اجداد"], "difficulty": "hard"}, {"id": 6, "arabic": "وَ يُدَرَبُ هَؤُلَاءِ الْجُنُودُ عَلَى اسْتِعْمَالِ الأَسْلِحَةِ الْحَدِيثَةِ، وَتُلْقَى عَلَيْهِمْ مُحَاضَرَاتٌ يَوْمِيَّةٌ فِي تَشْكِيْلَاتِ الْحُرُوْبِ وَطُرُقِ الْهُجُوْمِ وَالدَّفَاعِ . إِنَّ هَؤُلَاءِ الْجُنُودَ أَجْسَامُهُمْ قَوِيَّةٌ ، وَسَوَاعِدُهُمْ مَفْتُوْلَةٌ ، فَمَا أَقْوَاهُمْ فِي الْحُرُوبِ ، وَمَا أَشَدَّهُتَا فَاتِهِمُ الْمُجَلْجَلَةِ بِكَلْمَةِ التَّوْحِيدِ.", "urdu": "یہ فوجیں نئے ہتھیاروں کے استعمال کی مشقیں کرتی ہیں اور انھیں جنگ بندیوں حملہ اور دفاع سے متعلق یومیہ لکچرس دئے جاتے ہیں۔ ان فوجوں کے جسم قوی ہیں ان کے بازو مضبوط ہیں تو جنگوں میں ان کی طاقتیں کیا ہی خوب ہیں اور کلمہ توحید سے گونجنے والے ان کے نعرے کیا ہی زبردست ہیں۔", "keywords": ["ہتھیار", "فوج", "جنگ", "کلمہ توحید"], "difficulty": "hard"}]}, {"tamreen_no": 14, "title": "التَّمْرِينُ (١٤)", "type": "ترجمہ", "instruction": "اردو میں ترجمہ کرو۔", "total_questions": 4, "questions": [{"id": 1, "arabic": "رَسَالَةُ تَهْنِئَةٍ إِلَى الْأُمِّ بِمُنَاسَبَةِ حُلُولِ عِيْدِ مِيلَادِهَا أُمي الحنون ...... تَحِيَّةً إِسْلَامِيَّةً وَسَلَامًا مُبَارَكًا يَحْمِلُ إِلَى هَذَا الْيَوْمُ ذِكْرِى سَعِيدَةً، فَأَنْتَقَلَ بِالرُّوْحِ مِنْ غُرْفَةِ دَرْسِي، وَأَرْتَمِي بَيْنَ ذِرَاعَيْكِ ، مُقَدِّمًا لَكِ تَهْنِئَتِي بِعِيْدِكِ الْمَيْمُوْنَ . مُتَمَنِيًّا لَكِ حَيَاةً هَانِئَةً وَصِحَةً طَيِّبَةً .", "urdu": "ماں کی جانب اس کی جشن ولادت کے موقع پر ایک تہنیت نامہ میری انتہائی مشفق ماں ۔۔۔۔ اسلامی با برکت سلام یہ دن میرے لئے ایک نیک یاد گار لے کر آتا ہے تو میں اپنے مطالعہ کے کمرے سے روح کے ساتھ نکلتا ہوں تیری گود میں گرتا ہوں (ماں ) تیرے لئے خوش گوار زندگی اور اچھی صحت کی آرزو کرتے ہوئے تیرے با برکت جشن پر تجھے اپنی تہنیت پیش کرتا ہوں۔", "keywords": ["ماں", "تہنیت", "جشن ولادت", "سلام"], "difficulty": "medium"}, {"id": 2, "arabic": "حَقًّا يَا أُمَّاه ! إِنَّهُ لَمَنْ أَصْعَبِ الأُمُورِ عَلَى قَلْبِي أَنْ أَكُوْنَ بَعِيدًا عَنْكِ فِي مِثْلِ هَذَا الْيَوْمَ ، وَأَحْرُمَ لَذَةً يَتَمَتَّعُ بِهَا إِخْوَتِي الأَحْبَاءُ . لَكُمْ أَتَمَنَّى مِنْ صَمِيمِ قَلْبِي أَنْ أَشَارِكَهُمْ أَفْرَاحَهُمْ ، وَأَقَاسِمَهُمْ هَنَاءَهُمْ !.", "urdu": "بلا شبہ میری ماں میرے دل پر سب سے مشکل معاملہ یہ ہے کہ میں اس جیسے دن میں تجھ سے دور ہوتا ہوں اور میں اس لذت سے محروم رہتا ہوں جس سے میرے پیارے بھائی لطف اندوز ہوتے ہیں ، یقینا کئی مرتبہ میں دلی کی گہرائی سے آرزو کرتا ہوں کہ میں ان کی خوشیوں میں شریک ہو جاؤں اور ان کی شادمانی کو بانٹوں۔", "keywords": ["ماں", "دل", "خوشی", "آرزو"], "difficulty": "medium"}, {"id": 3, "arabic": "وَأَرَى أَنْ أَجْمَلَ هَدِيَّةٍ تَنْتَظِرِيْنَهَا مِنِّي هِيَ نَتِيْجَةُ امْتِحَانَاتِي ، فَثِقَيْ مِنَ الْآنَ أَنَّهَا سَتَكُوْنُ بِعَوْنِ اللهِ مِمَّا يَتَلِجُ صَدْرَكِ وَيُرِيْحُ بَالَكِ فَأَنَا مَا أَزَالُ أَعْمَلُ بِنَصَائِحِكِ الثَّمِينَةِ ، وَإِرْشَادَاتِكِ الْغَالِيَةِ ، وَاضِعًا نَصْبَ عَيْنِي الْمُسْتَقْبِلَ الَّذِي زَيَّنَتِهِ لِي .", "urdu": "اور میں سمجھتا ہوں کہ سب سے خوب صورت تحفہ جس کا تو میری جانب سے انتظار کر رہی ہے وہ میرے امتحانات کا رزلٹ ہے تو اب سے بھروسہ کر کہ وہ اللہ کی مدد سے تیرے دل کو ٹھنڈا کرے گا اور تیرا دل آرام پا جائے گا تو اب میں تیری قیمتی نصیحتوں اور گراں ہدایات پر عمل کر رہا ہوں اپنی آنکھوں کے سامنے اس مستقبل کے حصے کو رکھتے ہوئے جسے تو نے میرے لیے آراستہ کیا ہے۔", "keywords": ["تحفہ", "امتحان", "نصیحت", "مستقبل"], "difficulty": "medium"}, {"id": 4, "arabic": "فَازِرِيْنِي يَا أُمِّي ! بِدُعَائِكِ الصَّالِحِ لِأَتَمَكَّنَ مِنَ الْقِيَامِ بِوَاجِبَاتِي وَإِنَّنِي أَسْأَلُ اللهَ أَنْ بَيْنَ عَلَيْكِ بِالصَّحَةِ وَالْهَنَاءِ ، لِتَظَلَّ حَيَاتُكِ مَمْلُوْعَةٌ بِالأَعْيَادِ ، فَيَزْدَادُ بِذَلِكِ سُرُورِي ، وَ يَلَدُّ عَيْشِي.", "urdu": "اے میری ماں ! اپنی نیک دعا کے ذریعہ مجھے تقویت پہنچا تاکہ میں اپنے فرائض کو انجام دے سکوں، اور میں اللہ سے سوال کرتا ہوں کہ تجھ پر صحت و خوش گواری کے ذریعہ احسان فرمائے تاکہ تیری زندگی خوشیوں سے بھری رہے تو اس کے ذریعہ میری خوشی بڑھ جائے گی اور میری زندگی خوش ذائقہ ہو جائے گی۔", "keywords": ["ماں", "دعا", "صحت", "زندگی"], "difficulty": "medium"}]}, {"tamreen_no": 15, "title": "التَّمْرِينُ (١٥)", "type": "ترجمہ", "instruction": "اردو میں ترجمہ کرو۔", "total_questions": 17, "questions": [{"id": 1, "arabic": "صَيَّرَ الصَّائِعُ الذَّهَبَ سِوَارًا وَالْفِضَّةَ خَلْخَالًا.", "urdu": "سنار نے سونے کو کنگن اور چاندی کو پازیب بنا دیا۔", "keywords": ["سنار", "سونا", "چاندی", "کنگن"], "difficulty": "easy"}, {"id": 2, "arabic": "رَدَّ الأَمَلُ النُّفُوسَ الْيَائِسَةَ مُسْتَبْشِرَةً.", "urdu": "امید نے ناامید لوگوں کو خوش کر دیا۔", "keywords": ["امید", "ناامید", "خوش"], "difficulty": "easy"}, {"id": 3, "arabic": "اتَّخَذَ الصَّانِعُ الْحَدِيدَ مِدْفَعًا.", "urdu": "کاریگر نے لوہے کو توپ بنا دیا۔", "keywords": ["کاریگر", "لوہا", "توپ"], "difficulty": "easy"}, {"id": 4, "arabic": "وَهَبَ الْعَامِلُ الدَّقِيْقَ عَجِيْنَا .", "urdu": "مزدور نے آٹے کو گوندھا ہوا آٹا بنا دیا۔", "keywords": ["مزدور", "آٹا", "گوندھا ہوا"], "difficulty": "easy"}, {"id": 5, "arabic": "صَيَّرَتِ الْحَرْبُ الدَّامِيَةُ سُكَانَ الْبِلَادِ فُقَرَاءَ.", "urdu": "خوں ریز جنگ نے شہر کے باشندوں کو فقیر بنا دیا۔", "keywords": ["جنگ", "شہر", "فقیر"], "difficulty": "easy"}, {"id": 6, "arabic": "الْعَزِيمَةُ تَجْعَلُ الصَّعْبَ سَهْلًا .", "urdu": "حوصلہ مشکل کو آسان بنا دیتا ہے۔", "keywords": ["حوصلہ", "مشکل", "آسان"], "difficulty": "easy"}, {"id": 7, "arabic": "تَرَكَتِ الْعَاصِفَةُ الْأَشْجَارَ عَارِ يَةً مِنَ الثَّمَارِ وَالْأَوْرَاقِ.", "urdu": "آندھی نے درختوں کو پھلوں اور پتوں سے ننگا کر کے چھوڑ دیا۔", "keywords": ["آندھی", "درخت", "پھل", "پتے"], "difficulty": "medium"}, {"id": 8, "arabic": "تَخِذَتْ أُوْرُ نَا الْعُلُوْمَ وَالْتَّكْنَوْلُوْجِيَّةِ وَسِيْلَةَ الرَيِّ وَالْإِزْدِهَارِ.", "urdu": "یوروپ نے سائنس اور ٹکنالوجی کو آب باشی اور ترقی کا ذریعہ بنا دیا۔", "keywords": ["یوروپ", "سائنس", "ٹکنالوجی", "ترقی"], "difficulty": "medium"}, {"id": 9, "arabic": "اتَّخَذَ الحِبُّ الْحَدِيثُ الأَشِعَةَ عِلَاجًا لِبَعْضِ الأَمْرَاضِ.", "urdu": "نیے طب نے کرنوں کو کچھ بیماریوں کا علاج بنایا۔", "keywords": ["طب", "کرنیں", "بیماری", "علاج"], "difficulty": "medium"}, {"id": 10, "arabic": "جَعَلَتْ جُهُودُ الْقُوَّاتِ الْحَقِّ يَةِ انْسِحَابَ الْعَدُوِّ مِنْ أَرْضِنَا وَاقِعًا.", "urdu": "فضائی فوجوں کی کوششوں نے دشمن کا ہماری زمین سے پیچھے ہٹنا یقینی بنا دیا۔", "keywords": ["فضائی فوج", "دشمن", "زمین", "پیچھے ہٹنا"], "difficulty": "medium"}, {"id": 11, "arabic": "مَنْ جُعِلَ قَاضِيَّا بَيْنَ النَّاسِ فَقَدْ ذُبِحَ بِغَيْرِ سِكِينٍ.", "urdu": "جسے لوگوں کے درمیان قاضی بنایا گیا تو بغیر چھری کے ذبح کیا گیا۔", "keywords": ["قاضی", "لوگ", "ذبح", "چھری"], "difficulty": "medium"}, {"id": 12, "arabic": "وَقَدِمْنَا إِلَى مَا عَمِلُوا مِنْ عَمَلٍ فَجَعَلْتُهُ هَبَاءً مَّنْثُورًا - [الفرقان : ۲۳]", "urdu": "اور جو کچھ انھوں نے کام کئے تھے ہم نے قصد فرما کر انھیں بار یک بار یک غبار کے بکھرے ہوئے ذرے کر دیا کہ روزن کی دھوپ میں نظر آتے ہیں۔", "keywords": ["قرآن", "عمل", "غبار", "ذرے"], "difficulty": "medium"}, {"id": 13, "arabic": "يَأَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّخِذُوا الْكَفِرِينَ أَوْلِيَاءَ مِنْ دُونِ الْمُؤْمِنِينَ اَتُرِيدُونَ أَنْ تَجْعَلُوا لِلهِ عَلَيْكُمْ سُلْطَنَا مُّبِينًا [النساء : ۱۴۴]", "urdu": "اے ایمان والو ! کافروں کو دوست نہ بناؤ مسلمانوں کے سوا کیا یہ چاہتے ہو کہ اپنے اوپر اللہ کے لیے صریح حجت کر لو۔", "keywords": ["قرآن", "ایمان", "کافر", "دوست"], "difficulty": "medium"}, {"id": 14, "arabic": "مَا جَعَلَ اللهُ لِرَجُلٍ مِّنْ قَلْبَيْنِ فِي جَوْفِهِ وَمَا جَعَلَ أَزْوَجَكُمُ الَّتِي تُظهِرُوْنَ مِنْهُنَّ أُمَّهُتِكُمْ وَمَا جَعَلَ أَدْعِيَاءَكُمْ ابْنَاءَكُمْ ذَلِكُمْ قَوْلُكُمْ بِأَفْوَاهِكُمْ وَ اللهُ يَقُوْلُ الْحَقَّ وَهُوَ يَهْدِي السَّبِيلَ [الأحزاب: ٢]", "urdu": "اللہ نے کسی آدمی کے اندر دو دل نہ رکھے اور تمھاری ان عورتوں کو جنھیں تم ماں کے برابر کہ دو تمھاری ماں نہ بنایا اور نہ تمھارے لیے پالکوں کو تمھارا بیٹا بنایا۔", "keywords": ["قرآن", "دل", "عورت", "بیٹا"], "difficulty": "hard"}, {"id": 15, "arabic": "قَالَ الْأُسْتَاذُ إِنِّي مُوَجِّهُ إِلَيْكَ سُؤَالًا آخَرَ لَأَزْدَادَ ثِقَةٌ بِكَ وَ بِعِلْمِكَ. لَقَدْ حَدَّثْتَنِي عَنِ النَّحْلِ وَعَنْ عِلْمِهَا وَتَدْبِيْرِهَا لِشُؤْنِ نَفْسِهَا ، فَهَلْ لَكَ أَنْ تُحَدِّثَنِي عَنِ النَّمْلِ ؟", "urdu": "استاذ نے کہا: بلا شبہ میں تم سے ایک دوسرا سوال کر رہا ہوں تاکہ تمھاری ذات اور تمھارے علم سے متعلق میرے بھروسے میں اضافہ ہو جائے تم نے مجھے شہد تم نے مجھے شہد کی مکھی ، اس کے علم ، اپنے کاموں کے لیے اس کی تدبیر کے تعلق سے بتایا تو کیا تم مجھے چیونٹی کے بارے میں بتاؤ گے ؟", "keywords": ["استاذ", "سوال", "شہد کی مکھی", "چیونٹی"], "difficulty": "hard"}, {"id": 16, "arabic": "فَأَجَابَ الطَّالِبُ : إِنَّ النَّمْلَ تَتَّخِذُ مِنْ بَاطِنِ الْأَرْضِ مَنَازِلَ وَأَزِقَةً وَدَهَالِينَ وَغُرُفًا وَتَجْعَلُ بَعْضَ بُيُوتِهَا مُنْخَفِضًا كَيْ تَجْرِيَ إِلَيْهِ الْيَاهُ ، وَ بَعْضَهَا مُرْتَفِعًا وَتَجْعَلُ الْحَبَّ فِي الْبُيُوتِ الْمُرْتَفِعَةِ حَدْرًا عَلَيْهَا مِنَ الْمَطَرِ، وَتَقَطَّعُ الْحَبَّةَ نِصْفَيْنِ ، وَتَقْشُرُ الشَّعِيرَ وَالْبَاقِلَا وَالْعَدَسِ لِعِلْمِهَا أَنَّهَا لَا تَنْبُتُ مِنَ التَّقْشِيرِ .", "urdu": "طالب علم نے جواب دیا: یقینا چیونٹی زمین کے اندر مکانات گلیاں ڈیوڑھیاں اور کمرے بناتی ہے، اور کچھ اپنے گھر اتار چڑھاؤ والے بناتی ہے تاکہ اس تک پانی پہنچ جائے کچھ گھر بلند بناتی ہے اور بارش سے بچنے کے لیے دانہ کو اونچے گھروں میں رکھتی ہے اور دانہ کو دو حصوں میں کاٹتی ہے اور جو، باقلہ اور دال کو چھیلتی ہے کیوں کہ اسے معلوم ہے کہ یہ چھیلنے سے نہیں اگتے ہیں۔", "keywords": ["چیونٹی", "مکان", "بارش", "دانہ"], "difficulty": "hard"}, {"id": 17, "arabic": "قَالَ الْأُسْتَاذُ لِتِلْمِيذِهِ : بَارَكَ اللَّهُ فِيكَ ، فَمَا أَغْزَرَ عِلْمَكَ وَمَا أَفْصَحَ لِسَانَكَ وَمَا أَبْلَغَ عِبَارَتَكَ . (قواعد اللغة العربية، الثالث المتوسط ،ص:٢٨٥،٢٨٦)", "urdu": "استاذ نے اپنے شاگرد سے کہا اللہ تعالی تم میں برکت عطا فرمائے تمھارا علم کتنا زیادہ ہے تمھاری زبان کتنی فصیح ہے اور تمھاری عبارت کتنی ہی بلیغ ہے۔", "keywords": ["استاذ", "شاگرد", "برکت", "علم"], "difficulty": "easy"}]}, {"tamreen_no": 16, "title": "التَّمْرِينُ (١٦)", "type": "عربی میں ترجمہ", "instruction": "عربی بناؤ۔", "total_questions": 15, "questions": [{"id": 1, "arabic": "جَعَلَ الصَّانِعُ بِقِطَعِ الْحَدِيْدِ سَكَاكِيْنَ وَمَعَاوِلَ وَمَحَاوِرَ .", "urdu": "کاریگر نے لوہے کے ٹکڑوں سے چاقو، پھاوڑا اور کدال بنائے۔", "keywords": ["کاریگر", "لوہا", "چاقو", "پھاوڑا"], "difficulty": "medium"}, {"id": 2, "arabic": "جَعَلَتِ الْحَمَائِمُ الْوَحْشِيَّةُ نَوَافِذَ الْمَنَازِلِ الْمُرْتَفِعَةِ عُشُوشًا لَهَا .", "urdu": "جنگلی نگلی کبوتروں نے بلند بالا عمارت کے جھروکوں کو اپنا ٹھکانا بنایا۔", "keywords": ["کبوتر", "عمارت", "جھروکہ", "ٹھکانا"], "difficulty": "medium"}, {"id": 3, "arabic": "أَكْرِ مُوا الْكُتُبَ وَلَا تَجْعَلُوْهَا وِسَادَتَكُمْ.", "urdu": "کتابوں کا احترام کرو، اور انھیں اپنا تکیہ نہ بناؤ۔", "keywords": ["کتاب", "احترام", "تکیہ"], "difficulty": "easy"}, {"id": 4, "arabic": "جَعَلَتِ الشَّمْسُ الشَّدِيدَةُ وَالْحَرَارَةُ النَّاسَ كَالْمَيِّتِ.", "urdu": "تیز دھوپ اور گرمی نے لوگوں کو نیم مردہ کر دیا۔", "keywords": ["دھوپ", "گرمی", "لوگ", "نیم مردہ"], "difficulty": "medium"}, {"id": 5, "arabic": "جَعَلَ اللهُ النَّهَارَ مُنَوَّرًا وَاللَّيْلَ مُظْلِمًا .", "urdu": "اللہ تعالی نے دن کو روشن اور رات کو تاریک بنایا۔", "keywords": ["اللہ", "دن", "روشن", "رات"], "difficulty": "easy"}, {"id": 6, "arabic": "رَدَّ الْكَهْرَبَاءُ تَحْرِيْكَ الْمَاكِيْنَاتِ وَالْمَصَائِعِ وَالْعَامِلِ سَهْلًا جِدًّا.", "urdu": "بجلی نے مشینوں ، ملوں اور کارخانوں کا چلانا بہت آسان کر دیا۔", "keywords": ["بجلی", "مشین", "کارখানা", "آسان"], "difficulty": "medium"}, {"id": 7, "arabic": "لَا تَتَّخِذُوا التَّعْلِيمَ الدِّينِيَّ وَسِيْلَةً لِكَسْبِ الدُّنْيَا وَلَا تَجْعَلُوا الْأَحْكَامَ الإِسْلَامِيَّةَ لُعْبَةً.", "urdu": "دینی تعلیم کو دنیا حاصل کرنے کا ذریعہ اور اسلامی احکام کو کھلواڑ نہ بناؤ۔", "keywords": ["دینی تعلیم", "دنیا", "ذریعہ", "اسلامی احکام"], "difficulty": "medium"}, {"id": 8, "arabic": "صَيَّرَتِ الْعُلُومُ اِسْتِيْرَادَ الْأَشْيَاءِ وَتَصْدِيْرِهَا سَهْلًا جِدًّا بِوَسَائِلِ الإِعْلَامِ الْجَدِيدَةِ وَوَسَائِلِ النَّقْلِ .", "urdu": "سائنس نے جدید ذرائع ابلاغ حمل و نقل کے ذریعہ اشیا کی درآمد و برآمد کو نہایت آسان بنا دیا۔", "keywords": ["سائنس", "ذرائع ابلاغ", "آمد و رفت", "آسان"], "difficulty": "hard"}, {"id": 9, "arabic": "جَعَلَتِ الْجَرِيدَةُ وَالْمُدْيَاعُ وَالتِّلْفَازُ إِذَاعَةَ الْأَنْبَاءِ سَهْلَةً.", "urdu": "اخبار ، ریڈیو اور ٹیلی ویزن نے خبر رسانی کو آسان کر دیا۔", "keywords": ["اخبار", "ریڈیو", "ٹیلی ویژن", "خبر"], "difficulty": "medium"}, {"id": 10, "arabic": "جَعَلَ الْبَنَّاءُ أَعْمِدَةَ هَذَا الْمَنْزِلِ مَتِينَةٌ جَمِيلَةٌ ثَابِتَةً .", "urdu": "معمار نے اس عمارت کے ستون ، مضبوط ، خوب صورت اور دیر پا بنائے۔", "keywords": ["معمار", "عمارت", "ستون", "مضبوط"], "difficulty": "medium"}, {"id": 11, "arabic": "جَعَلَ اللَّهُ الْكَوَاكِبَ زِيْنَةٌ لِلسَّمَاءِ.", "urdu": "اللہ تعالی نے ستاروں کو آسمان کے لیے آرائش کا سامان بنایا۔", "keywords": ["اللہ", "ستارے", "آسمان", "آرائش"], "difficulty": "easy"}, {"id": 12, "arabic": "صَيَّرَ الْحَاسُوبُ شَبَكَةُ الْإِتَصَالَاتِ وَوَسَائِلُ الْأَعْلَامِ الْحَدِيثَةِ الدُّنْيَا قَرْيَةً", "urdu": "کمپیوٹر، انٹر نیٹ اور جدید ذرائع ابلاغ نے دنیا کو ایک گاؤں میں تبدیل کر دیا ہے۔", "keywords": ["کمپیوٹر", "انٹرنیٹ", "دنیا", "گاؤਂ"], "difficulty": "medium"}, {"id": 13, "arabic": "يَجْعَلُ الْجِدُّ وَالشَّغَفُ الرَّجُلَ الْفَقِيْرَ غَنِيًّا وَ يُصَيِّرُ عُسْرَهُ يُسْرًا.", "urdu": "محنت اور لگن غریب آدمی کو مال دار بنا دیتی ہے اور اس کی بدحالی کو خوش حالی میں تبدیل کر دیتی ہے .", "keywords": ["محنت", "لگن", "غریب", "مالدار"], "difficulty": "medium"}, {"id": 14, "arabic": "كَانَ الإِسْلَامُ جَعَلَ الزَّوَاجَ سَهْلًا جِدًّا وَلَكِنْ صَيَّرْنَاهُ صَعْبًا بِالتَّقَالِيدِ.", "urdu": "اسلام نے شادی کو بہت آسان بنایا تھا، لیکن ہم نے رسم و رواج کے ذریعہ اسے مشکل بنا دیا۔", "keywords": ["اسلام", "شادی", "آسان", "رسم و رواج"], "difficulty": "medium"}, {"id": 15, "arabic": "صَيَّرَ سَيِّدُنَا الْغَوْثُ الْأَعْظَمُ الْمُجْتَمَعَ الْفَاسِدَ مُجْتَمِعًا صَالِحًا بِخْطَبِهِ الْمُؤَثَّرَةِ.", "urdu": "سیدنا غوث اعظم نے اپنے اثر انگیز خطبات کے ذریعہ بگڑے ہوئے معاشرے کو صالح معاشرے میں تبدیل کر دیا۔", "keywords": ["غوث اعظم", "معاشرہ", "خطبہ", "اصلاح"], "difficulty": "medium"}]}, {"tamreen_no": 17, "title": "التَّمْرِينُ (١٧)", "type": "ترجمہ اور مفعول مطلق", "instruction": "آنے والے جملوں کا اردو میں ترجمہ کرو اور رسم الخط کے ذریعہ مفعول مطلق کی تعیین کرو۔", "total_questions": 13, "questions": [{"id": 1, "arabic": "قُلْ قَوْلَ الْعُقَلَاءِ وَافْعَلْ فِعْلَ التَّبَلَاءَ.", "urdu": "عقل مند لوگوں کی طرح بات کہ اور شرفالوگوں کی طرح کام کر۔", "keywords": ["عقل مند", "بات", "کام"], "difficulty": "easy"}, {"id": 2, "arabic": "سَعَى الْحَاجُ بَيْنَ الصَّفَا وَالْمَرْوَةَ الهَرْوَلَةَ .", "urdu": "حاجی صفا اور مروہ کے درمیان تیز دوڑا۔", "keywords": ["حاجی", "صفا", "مروہ", "دوڑنا"], "difficulty": "easy"}, {"id": 3, "arabic": "قَلِقَ الْمُوَظَّفُ مِنْ مُقَابَلَةِ مُدِيرِهِ اضْطِرَابًا.", "urdu": "مزدور اپنے مینیجر کا سامنا کرنے سے بے چین ہو گیا۔", "keywords": ["مزدور", "مینیجر", "بے چین"], "difficulty": "medium"}, {"id": 4, "arabic": "يُدَافِعُ الْجُنُودُ عَنِ الْوَطَنِ دِفَاعَ الشَّجْعَانِ.", "urdu": "فوجی بہادروں کی طرح وطن کا دفاع کرتے ہیں۔", "keywords": ["فوجی", "وطن", "دفاع", "بہادر"], "difficulty": "easy"}, {"id": 5, "arabic": "لَا تَفْرَحْ فَرَحًا مُسْرِفًا وَلَا تَحْزَنْ حُزْنًا مُفْرِطًا.", "urdu": "حد سے زیادہ خوش نہ ہو اور حد سے زیادہ رنجیدہ نہ ہو۔", "keywords": ["خوش", "رنجیدہ", "حد"], "difficulty": "easy"}, {"id": 6, "arabic": "أَعْطِفُ عَلَى ابْنِي عَطَفًا لَا أَعْطِفُهُ عَلَى أَحَدٍ سِوَاهُ.", "urdu": "میں اپنے بیٹے پر ایسی شفقت کرتا ہوں کہ اس جیسی شفقت اس کے علاوہ کسی پر نہیں کرتا ہوں۔", "keywords": ["بیٹا", "شفقت", "محبت"], "difficulty": "medium"}, {"id": 7, "arabic": "يَرْتَفِعُ الْهَرَمُ ارْتِفَاعًا ، وَ يَصْمُدُ لِلزَّمَنِ صُمُوْدَ الْجِبَالِ.", "urdu": "واقعی بوڑھا بہت بلند ہوتا ہے اور زمانے کے لیے پہاڑوں کی طرح ثابت قدم رہتا ہے۔", "keywords": ["ہرم", "بلند", "زمانه", "پہاڑ"], "difficulty": "medium"}, {"id": 8, "arabic": "أَتْقَنَ الْعَامِلُ عَمَلَهُ إِثْقَانًا ، وَأَخْلَصَ فِيهِ إِخْلَا صَا عَظِيمًا.", "urdu": "کاریگر نے اپنے کام کو مضبوطی سے کیا اور اس میں اس نے بڑے اخلاص سے کام لیا۔", "keywords": ["کاریگر", "کام", "مضبوطی", "اخلاص"], "difficulty": "medium"}, {"id": 9, "arabic": "حَافَظْتُ عَلَى الْبِيِّنَةِ مُحَافَظَةً ، وَمَنَعْتُ الضَّوْضَاءَ مَنْعًا بَاتًا.", "urdu": "میں نے ماحول کی اچھی طرح حفاظت کی اور شور و شغب کو پورے طور پر روک دیا۔", "keywords": ["ماحول", "حفاظت", "شور"], "difficulty": "medium"}, {"id": 10, "arabic": "أُعَاتِبُ صَدِيقِي عَتَابًا رَقِيقًا، وَأَصْفَحُ عَنهُ الصَّفْحَ الْجَمِيلَ.", "urdu": "میں اپنے دوست کو معمولی ملامت کرتا ہوں اور اچھی طرح در گزر کرتا ہوں۔", "keywords": ["دوست", "ملامت", "درگزر"], "difficulty": "medium"}, {"id": 11, "arabic": "يَعْتَمِدُ الْمُؤْمِنُ عَلَى اللهِ اِعْتِمَادًا كَبِيرًا ، بَعْدَ أَنْ يُخَطِطَ لِعَمَلِهِ تَخْطِيطًا سَلِيمًا.", "urdu": "مومن اپنے کام کا درست منصوبہ بنانے کے اللہ تعالی پر مکمل بھروسا کرتا ہے۔", "keywords": ["مومن", "اللہ", "بھروسہ", "منصوبہ"], "difficulty": "medium"}, {"id": 12, "arabic": "أَمْسَكَ الشَّرْطِيُّ بِاللَّضِ إِمْسَاكًا، فَدَفَعَ يَدَهُ عَنْهُ دَفْعَتَيْنِ، فَصَبَرَ عَلَى مُحَاوَلَتِهِ فِي الْهَرْبِ صَبْرًا جَمِيلًا.", "urdu": "پولیس والے نے چور کو مضبوطی سے پکڑ لیا، پھر اس نے دو مرتبہ اپنا ہاتھ اس سے ہٹالیا ، تو اس نے اس کے بھاگنے کے ارادے پر اچھی طرح صبر کیا۔", "keywords": ["پولیس", "چور", "پکڑنا", "صبر"], "difficulty": "hard"}, {"id": 13, "arabic": "تَفُورُ الْبَرَاكِينُ فِي بَعْضِ الْجِهَاتِ ثَوَرَانًا شَدِيدًا ، فَتَهْدِمُ الْمَنَازِلَ هَدَمًا ، وَتَدُلُّ الْمُبَانِي دَكَّا، وَتَقْذُفُ الْنِيْرَانَ قَذَفًا مُسْتَمِرًا ، فَيَخَافُ السُّكَّانُ خَوْفًا عَظِيمًا ، فَلَا تَسْمَعُ غَيْرَ نِسَاءِ تَصِبْحِ صِبَاحًا، وَأَطْفَالٍ تَصْرُحْ صُرَاحًا ، وَلَا تَرى إِلَّا رِجَالًا نَكَبَهُمُ الدَّهْرُ نَكْبَتَيْنِ: مَاتَ أَوْلَادُهُمْ وَ ضَاعَتْ أَمْوَالُهُمْ.", "urdu": "بعض علاقوں میں کوہ آتش فشاں، زبردست طریقے سے پھٹ جاتے ہیں تو مکانات کو پوری طرح ڈھا دیتے ہیں، عمارتوں کو بالکل مسمار کر دیتے ہیں اور سلسل آگ نکالتے رہتے ہیں تو باشندے بڑے خوف زدہ ہو جاتے ہیں، تو تم زور زور سے چلانے والی عورتوں اور چیچنے والے بچوں کے علاوہ کسی کو نہیں سنو گے اور تم صرف ایسے لوگ دیکھو گے جنھیں زمانے نے دوہری پریشانی میں ڈال دیا ان کی اولادیں مر گئیں اور مال برباد ہو گیے۔", "keywords": ["آتش فشاں", "مکان", "عمارت", "خوف"], "difficulty": "hard"}]}, {"tamreen_no": 18, "title": "التَّمْرِينُ (١٨)", "type": "عربی میں ترجمہ", "instruction": "عربی میں ترجمہ کرو۔", "total_questions": 15, "questions": [{"id": 1, "arabic": "نَجَحَ الطَّلَابُ الْمُجْتَهِدُوْنَ فِي الْإِمْتِحَانِ السَّنَوِي نَجَا حَارَائِعًا.", "urdu": "محنتی طلبہ نے سالانہ امتحان میں شاندار کامیابی حاصل کی۔", "keywords": ["طالب علم", "امتحان", "کامیابی"], "difficulty": "medium"}, {"id": 2, "arabic": "جَاءَ سَاعِي الْبَرِيدِ بَيْتَ أَحْمَدَ بِالرِّسَالَةِ وَطَرَقَ الْبَابَ طَرْقًا .", "urdu": "ڈاکیا احمد کے گھر خط لے کر آیا اور زور سے دروازہ کھٹکھٹایا۔", "keywords": ["ڈاکیا", "خط", "دروازہ"], "difficulty": "medium"}, {"id": 3, "arabic": "قَالَ قَائِدُ الْجَيْشِ لِجُيُوشِهِ اهْجِمُوا عَلَى مَرَاكِزِ الْعَدُوِّ هَجُوْمًا شَدِيدًا، وَلَا تَخَافُوْا الْأَعْدَاءَ خَوْفَ الْجُبَنَاءِ.", "urdu": "سپہ سالار نے اپنے فوجیوں سے کہا دشمن کی چوکیوں پر زور دار حملہ کرو اور بزدلوں کی طرح دشمنوں سے نہ ڈرو۔", "keywords": ["سپہ سالار", "فوجী", "حملہ", "دشمن"], "difficulty": "medium"}, {"id": 4, "arabic": "ضَرَبَ خَالِدٌ الْكَلْبَ فَغَضِبَ غَضَبًا شَدِيدًا وَعَضَ فِي رِجْلِهِ عَضًا .", "urdu": "خالد نے کتے کو مارا تو وہ بہت زیادہ غضب ناک ہو گیا اور اس کی ٹانگ میں زور سے کاٹ لیا۔", "keywords": ["خالد", "کتا", "غصہ", "کاٹنا"], "difficulty": "medium"}, {"id": 5, "arabic": "لَمَّا سَمِعَ عَبْدُ الرَّحْمَنِ خَيْرَ نَجَاحِهِ فِي الإِمْتِحَانِ أَشْرَقَ وَجْهُهُ إِشْرَاقَ الْبَدْرِ.", "urdu": "جب عبدالرحمن نے امتحان میں اپنی کامیابی کی خبر سنی تو اس کا چہرہ چاند کی طرح چمک اٹھا۔", "keywords": ["عبدالرحمن", "امتحان", "کامیابی", "چہرہ"], "difficulty": "medium"}, {"id": 6, "arabic": "الْيَوْمَ قَدْ وَصَلَ الْإِنْسَانُ إِلَى الْفَضَاءِ وَنَجَحَ نَجَاحًا عَظِيمًا فِي فَنَّ الطَّيَرَانِ.", "urdu": "آج انسان خلا تک پہنچ گیا ہے اور ہوا بازی کے فن میں زبردست کامیابی حاصل کر چکا ہے۔", "keywords": ["انسان", "خلا", "ہوا بازی", "کامیابی"], "difficulty": "medium"}, {"id": 7, "arabic": "يَخْدِمُ النَّاسَ خِدْمَةٌ عَظِيمَةٌ وَيُوَفِّرُ لَهُمْ فِي السَّفَرِ تَسْهِيْلَاتٍ تَوْفِيرًا .", "urdu": "وہ لوگوں کی زبر دست خدمت کرتا ہے اور سفر میں ان کے لیے واقعی ، سہولتیں فراہم کرتا ہے۔", "keywords": ["خدمت", "سفر", "سہولت"], "difficulty": "medium"}, {"id": 8, "arabic": "رَأَيْتُ أَمْسِ طِفْلًا صَغِيرًا يَجْرِي عَلَى الشَّارِعِ جَرْ يَا بِسُرْعَةٍ وَلَا يُبَالِي أَيَّ مُبَالَاةٍ بِالسَّيَّارَاتِ الْمَارَةِ.", "urdu": "کل میں نے ایک چھوٹے بچے کو دیکھا جو سڑک پر تیزی کے ساتھ دوڑ رہا تھا اور گزرنے والی گاڑیوں کی کچھ پرواہ نہیں کر رہا تھا۔", "keywords": ["بچہ", "سڑک", "دوڑنا", "گاڑی"], "difficulty": "medium"}, {"id": 9, "arabic": "خَالِدَةُ طَالِبَةٌ فِي السَّنَةِ الأُولَى مِنْ بی اے وَ هِيَ تُكْرِمْ مُعْلِّمَاتِهَا إِكْرَامًا عَظِيمًا .", "urdu": "خالدہ بی اے سال اول کی طالبہ ہے ، وہ اپنی استانیوں کا بڑا احترام کرتی ہے۔", "keywords": ["خالدہ", "طالبہ", "استانی", "احترام"], "difficulty": "medium"}, {"id": 10, "arabic": "الْغَوَّاصَةُ مِنْ آلَاتٍ حَرْبِيَّةٍ جَدِيدَةٍ تَسِيرُ فِي الْبَحْرِ فِي دَاخِلِ الْمَاءِ سَيْرَ الْأَسْمَاكِ وَتَقُوْمُ بِدَوْرٍ هَامَ فِي الْحَرْبِ الْبَحْرِي.", "urdu": "پن ڈبی جدید جنگی آلات میں سے ہے جو سمندر میں پانی کے اندر مچھلیوں کی طرح چلتی ہے، اور سمندری لڑائی میں زبردست رول ادا کرتی ہے۔", "keywords": ["پن ڈبی", "جنگی آلہ", "سمندر", "مچھلی"], "difficulty": "hard"}, {"id": 11, "arabic": "إِنَّ الدَّرَاجَةَ الْبُخَارِيَّةَ مَرْكَبَةٌ مُفِيدَةٌ تَسِيرُ عَلَى الشَّوَارِعِ سَيْرَ الْعَرَبَةِ وَتُوَفِّرُ لِلنَّاسِ تَسْهِيْلَاتٍ لَا يُوْجَدُ مَثِيْلٌ لَهَا فِي الْعَصْرِ الْمَاضِي.", "urdu": "موٹر سائگل سچ مچ ایک نفع بخش سواری ہے جو موٹر کی طرح سڑکوں پر تیز چلتی ہے اور لوگوں کے لیے ایسی آسانیاں فراہم کرتی ہے کہ گزشتہ زمانے میں اس کی نظیر نہیں ملتی۔", "keywords": ["موٹر سائیکل", "سواری", "سڑک", "آسانی"], "difficulty": "medium"}, {"id": 12, "arabic": "رَأَيْنَا أَمْسِ أَنَّ قَاطِعَ الطَّرِيْقِ بِالْعَرَبَةِ الْمَسِيْرَةِ أَطْلَقَ الرَّصَاصَ عَلَى تَاجِرٍ بِالْمُسَدَّسِ الَّذِي خَرَجَ نَقْبَ جُنَاحِهِ.", "urdu": "ہم نے کل دیکھا کہ ایک ڈاکو نے چلتی گاڑی سے ایک تاجر پر ریوالور سے ایسا فائر کیا جو اس کے بازو کو چھید کر باہر نکل گیا۔", "keywords": ["ڈاکو", "گاڑی", "تاجر", "گولی"], "difficulty": "hard"}, {"id": 13, "arabic": "الْحَيَّةُ مِنَ الْحَيْوَانَاتِ الْمُؤذِيَةِ إِذَا لَدَغَتْ أَحَدًا تُهْلِكُهُ هَلَاكًا تَامًا .", "urdu": "سانپ ایک موذی جانور ہے جو کسی کو کاٹ لیتا ہے تو اس کا کام بالکل تمام کر دیتا ہے۔", "keywords": ["سانپ", "جانور", "کاٹنا", "ہلاک"], "difficulty": "medium"}, {"id": 14, "arabic": "أَمْطَرَتِ السَّمَاءُ مَطَرًا غَزِيْرًا فِي بَنْغَلَا دَيشَ فِي الْأَسْبُوعِ الْمَاضِي فَهَدَمَ الْمَنَازِلَ الْكَثِيرَةَ هَدْمًا تَانًا وَأَفْنَى الْحُقُوْلَ الْكَثِيرَةَ فَنَاءً كَامِلًا .", "urdu": "گزشتہ ہفتے بنگلہ دیش میں ایسی زور دار بارش ہوئی جس نے بہت سے مکانات کو بالکل ڈھا دیا اور بہت سی کھیتیوں کو پوری طرح تباہ کر دیا۔", "keywords": ["بارش", "بنگلہ دیش", "مکان", "کھیتی"], "difficulty": "hard"}, {"id": 15, "arabic": "يُهْتَمُّ بِالضَّوْءِ فِي الطُّرْقِ وَالأَزِقَةِ فِي الْمُدْنِ اِهْتِمَامًا جِدًّا وَتُوْقَدُ الْمَصَابِيحُ الْكَهْرَ بَائِيَّةُ الَّتِي تُذْهِبُ الظَّلَامَ كُلَّ الْإِذْهَابِ.", "urdu": "شہروں میں راستوں اور گلی کوچوں میں روشنی کا بہت اہتمام کیا جاتا ہے اور ایسے بلب جلائے جاتے ہیں جو اندھیرے کو بالکل کافور کر دیتے ہیں۔", "keywords": ["شہر", "راستہ", "روشنی", "بلب"], "difficulty": "medium"}]}, {"tamreen_no": 19, "title": "التَّمْرِينُ (١٩)", "type": "ترجمہ", "instruction": "عربی کا اردو میں ترجمہ کرو۔", "total_questions": 12, "questions": [{"id": 1, "arabic": "أَقْبَلَ الْعُمَّالُ عَلَى عَمَلِهِمْ كُلَّ الْإِقْبَالِ .", "urdu": "کام کرنے والے اچھی طرح اپنے کام میں لگ گیے۔", "keywords": ["مزدور", "کام"], "difficulty": "easy"}, {"id": 2, "arabic": "أَجَابَ خَالِدٌ عَنِ السُّؤَالِ سَرِيعًا .", "urdu": "خالد نے فور اسوال کا جواب دیا۔", "keywords": ["خالد", "سوال", "جواب"], "difficulty": "easy"}, {"id": 3, "arabic": "مَرَّ الْقِطَارُ مَرَّ السَّحَابِ.", "urdu": "ٹرین بادل کی طرح گزری۔", "keywords": ["ٹرین", "بادل"], "difficulty": "easy"}, {"id": 4, "arabic": "أُقَدِّرُ الْفَنَّ تَقْدِيرًا لَا أُقَدِرُهُ شَيْئًا آخَرَ .", "urdu": "میں آرٹ کی ایسی قدر کرتا ہوں کہ اس طرح دوسری چیز کی نہیں کرتا ہوں.", "keywords": ["آرٹ", "قدر"], "difficulty": "medium"}, {"id": 5, "arabic": "أَقْبَلَ طُلَّابُ الْعِلْمِ عَلَى تَعَلُّمِ اللُّغَةِ الْعَرَبِيَّةِ إِقْبَالًا مَحْمُوْدًا.", "urdu": "طلبہ نے خوب اچھی طرح عربی زبان سیکھنا شروع کیا۔", "keywords": ["طلبہ", "عربی زبان", "سیکھنا"], "difficulty": "medium"}, {"id": 6, "arabic": "وَسْوَسَ الشَّيْطَانُ لِلإِنْسَانِ وَسْوَسَةً ، وَزَخْرَفَ لَهُ الْبَاطِلَ زَخْرَفَةً ، فَمَنْ اسْتَجَابَ لَهُ زَلْزَلَ حَيَاتَهُ زِلْزَالًا شَدِيدًا.", "urdu": "شیطان نے انسان کے لیے وسوسہ ڈالا، اور اس کے لیے جھوٹ کو سجا کر پیش کیا تو جس نے اسے تسلیم کیا اس کی زندگی میں زبر دست زلزلہ پیدا کر دیا.", "keywords": ["شیطان", "وسوسہ", "باطل", "زندگی"], "difficulty": "hard"}, {"id": 7, "arabic": "إِنَّ وَالِدَيَّ قَدْرَ بَيَانِي تَرْبِيَةً كَرِيمَةً وَتَعِبَا فِي سَبِيلِ ذَلِكَ تَعَبًا شَدِيدًا.", "urdu": "واقعی میرے والدین نے میری اچھی تربیت کی اور اس کی راہ میں سخت تھکن برداشت کی .", "keywords": ["والدین", "تربیت", "محنت"], "difficulty": "medium"}, {"id": 8, "arabic": "إِنَّ مَشْرُوْعَ الْقِرَاءَةِ لِلْجَمِيعِ مِنَ الْمَشْرُوعَاتِ الَّتِي أَثَرَتِ الثَّقَافَةَ فِي مِصْرٍ إِثْرَاءً بَالِغَا.", "urdu": "یقینا تمام لوگوں کے لیے تعلیم کا منصوبہ ایسا منصوبہ ہے جس نے شہر میں تہذیب و تمدن میں زبردست اضافہ کر دیا۔", "keywords": ["تعلیم", "منصوبہ", "تہذیب", "مصر"], "difficulty": "medium"}, {"id": 9, "arabic": "أُحْسِنُ إِلَى الْوَالِدَيْنِ إِحْسَانًا وَأَخْفِضُ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ خَفْضًا.", "urdu": "میں والدین کے ساتھ اچھا سلوک کرتا ہوں اور دونوں کے لیے نرم دلی سے عاجزی کا باز و بچھاتا ہوں .", "keywords": ["والدین", "سلوک", "عاجزی", "رحمت"], "difficulty": "medium"}, {"id": 10, "arabic": "حَجَجْتُ بِهِمَا بَيْتَ اللهِ حَجَاتٍ ثَلَاثًا وَزُرْنَا قَبْرَ الرَّسُولِ صَلَى اللَّهُ عَلَيْهِ وَسَلَّمَ زَوْرَتَيْنِ.", "urdu": "میں نے دونوں کے ساتھ خانہ کعبہ کے تین حج کیے اور دو مرتبہ رسول پاک کے روضہ انور کی زیارت کی۔", "keywords": ["حج", "خانہ کعبہ", "زیارت", "رسول"], "difficulty": "medium"}, {"id": 11, "arabic": "أَثْنَيْتُ عَلَى الْفَائِزِ الْأَوَّلِ ثَنَاءً لَا أُثْنِيْهِ لِأَحَدٍ غَيْرِهُ ، وَأَحْتَرِمُ الْمُتَوَفِّقَ احْتِرَامًا لَمْ أَحْتَرِ مُهُ لِغَيْرِهِ.", "urdu": "پہلے کامیاب ہونے والے کی میں نے ایسی تعریف کی کہ اس کے علاوہ کسی کی ایسی تعریف نہیں کی اور کامیاب ہونے والے کی ایسی عزت و افزائی کرتا ہوں کہ ایسی دوسرے کی نہیں کرتا ہوں۔", "keywords": ["کامیاب", "تعریف", "عزت"], "difficulty": "medium"}, {"id": 12, "arabic": "التَّمْرِيْنَاتُ الْبَدَنِيَّهُ تَزِيْدُ الْعَضَلَاتِ صَلَابَةٌ وَالْقَلْبَ قُوَّةً ، وَ تُسَاعِدُ الْأَمْعَاءَ وَالْكَلِي أَتَمَ مُسَاعَدَةٌ ، فَعَلَى الْإِنْسَانِ أَنْ يُعْنَى بِهَا كُلَّ الْعِنَايَةِ ، وَأَنْ يَجْعَلَ لِنَفْسِهِ حَظًّا مِنْهَا كُلَّ يَوْمٍ ، وَأَفْضَلُ أَنْوَاعِ التَّمْرِيْنِ الْبَدَنِي مَا كَانَ فِي الْهَوَاءِ الطَّلَقِ ، فَيَحْسُنُ بِالإِنْسَانِ أَنْ يَمْشِيَ فِي الْحُقُوْلِ كَثِيرًا، وَأَنْ يَسْبَحَ عَوْمًا ، وَأَنْ يَْمْتَطِيَ صَهَوَاتِ الْخَيْلِ رُكُوبًا، وَأَنْ يَشْتَغِلَ فِي حَدِيقَةِ مَنْزِلِهِ مَرَّتَيْنِ أَوْ ثَلَاثًا كُلَّ أُسْبُوعِ، وَعَلَى الْإِنْسَانِ أَلَّا يُجْهِدَ نَفْسَهُ فِي هَذَا التَّمْرِيْنِ ذَلِكَ الْإِجْهَادِ الَّذِي يَأْتِيهِ الْمُتَنَافِسُوْنَ فِي مَيَادِيْنِ السَّبَاقِ ، فَإِنَّ ذلِكَ قَدْ يَضُرُّ الْحِسْمَ أَكْثَرَ مِمَّا يُفِيدُهُ.", "urdu": "جسمانی ورزش پٹھوں کو زیادہ سخت اور دل کو زیادہ طاقت ور کرتی ہیں ، آنتوں اور گردوں کی مکمل مدد کرتی ہیں، تو انسان کو اس پر پوری توجہ دینی چاہیے اور اپنے لیے اس میں سے ہر دن ایک حصہ مقرر کرے اور جسمانی ورزش کے اقسام میں سے سب سے بہتر وہ ہے جو کھلی ہوا میں ہو، تو انسان کا کھیتوں میں زیادہ چلنا ، تیرنا، گھوڑے کی پیٹھ پر خوب سوار ہونا اور اپنے مکان کے باغ میں ہر ہفتہ دو یا تین مرتبہ مصروف رہنا اچھا ہوتا ہے اور انسان پر ضروری ہے کہ خود کو ورزش کی اس مشقت میں نہ ڈالے جس میں دوڑ کے میدانوں میں مقابلہ کرنے والے لوگ پڑتے ہیں کیوں کہ ایسی ورزش جسم کو فائدہ سے زیادہ نقصان دیتی ہے۔", "keywords": ["ورزش", "جسم", "دل", "صحت"], "difficulty": "hard"}]}, {"tamreen_no": 20, "title": "التَّمْرِينُ (٢٠)", "type": "عربی میں ترجمہ", "instruction": "عربی میں ترجمہ کرو۔", "total_questions": 14, "questions": [{"id": 1, "arabic": "خَافُوا اللَّهَ أَيْنَمَا تَكُونُوا وَاذْكُرُوهُ ذِكْرًا كَثِيرًا.", "urdu": "تم جہاں بھی رہو اللہ تعالی سے ڈرتے رہو اور اس کو خوب یاد کرتے رہو۔", "keywords": ["اللہ", "خوف", "ذکر"], "difficulty": "easy"}, {"id": 2, "arabic": "عِنْدَمَا يُسْفِرُ الصُّبْحُ تَخْرُجُ الطُّيُورُ مِنْ أَعْشَاشِهِمْ وَتُغَرِدُ عَلَى أَغْصَانِ الْأَشْجَارِ تَغْرِيدًا.", "urdu": "جب صبح ہوتی ہے پرندے اپنے گھونسلوں سے باہر نکلتے ہیں اور درختوں کی شاخوں پر خوب چہچہاتے ہیں۔", "keywords": ["صبح", "پرندہ", "گھونسلا", "درخت"], "difficulty": "medium"}, {"id": 3, "arabic": "مَسْعُودٌ طَالِبٌ مُجْتَهِدُ الَّذِي يَجْتَهِدُ فِي الْقِرَاءَةِ اِجْتِهَادًا وَ يَكْتُبُ أَجْوِبَةَ الْأَسْئِلَةِ الْإِمْتِحَانِيَّةِ وَاضِحًا عَلَى كُرَاسَتِهِ.", "urdu": "مسعود ایک محنتی طالب علم ہے جو پڑھنے میں خوب محنت کرتا ہے اور امتحانی سوالات کے جوابات صاف صاف اپنی کاپی پر لکھتا ہے۔", "keywords": ["مسعود", "طالب علم", "محنت", "امتحان"], "difficulty": "medium"}, {"id": 4, "arabic": "انْهَدَمَ الْبَارِحَةَ مَنْزِلْ إِنْهِدَامًا تَامَّا بِنُزُولِ الْمَطَرِ الْغَزِيرِ وَسَاعَدَ الْخِثْرَانُ أَصْحَابَ الْبَيْتِ فِي إِخْرَاجِ مَتَاعِ ذَلِكَ الْبَيْتِ مُسَاعَدَةٌ وَسَعِيَ لِذَلِكَ الْبُولِيسُ أَيْضًا.", "urdu": "کل رات تیز بارش کی وجہ سے ایک مکان بالکل ڈھ گیا، پڑوسیوں نے اس گھر کا سامان نکالنے میں گھر والوں کی بہت مدد کی اور پولیس نے بھی اس کے لیے کوشش کی۔", "keywords": ["بارش", "مکان", "پڑوسی", "پولیس"], "difficulty": "hard"}, {"id": 5, "arabic": "تَعْصِفُ الرِّيَاحُ مِنَ صَبَاحِ الْيَوْمِ وَ يَنْزِلُ الْمَطَرُ رَشَاشًا وَقَدْ صَارَ الْجَو رَائِفًا جِدًا ، وَمِمَّا يَنْفَعُ الْحُقُوْلَ كَثِيرًا.", "urdu": "آج صبح سے تیز ہوائیں چل رہی ہیں ، ہلکی ہلکی بارش ہورہی ہے اور موسم نہایت خوشگوار ہو گیا ہے۔ اس سے کھیتوں کا بہت فائدہ ہوگا۔", "keywords": ["ہوا", "بارش", "موسم", "کھیت"], "difficulty": "medium"}, {"id": 6, "arabic": "مَنْ لَا يَعْلَمُ أَنَّ الْيَهُودَ عَدُوٌّ شَدِيدٌ لِلْمُسْلِمِينَ، يُدَبِّرُوْنَ الْمُوَامِرَاتِ تَدْبِيرًا مُسْتَمِرُ الإِلْحَاقِهِمُ الضَّرَرَ، وَلَا يَتَعَهَّدُوْنَ حُقُوْقَ الْإِنْسَانِ شَيْئًا .", "urdu": "کون نہیں جانتا کہ یہودی مسلمانوں کے سخت دشمن ہیں ، وہ انھیں نقصان پہنچانے کے لیے برابر سازشیں کرتے رہتے ہیں اور انسانی حقوق کا کچھ بھی خیال نہیں رکھتے ۔", "keywords": ["یہودی", "مسلمان", "دشمن", "سازش"], "difficulty": "medium"}, {"id": 7, "arabic": "مَرِضَ أَخٌ حَامِدٍ مَرَضًا شَدِيدًا أَمْسِ ، أُصِيْبَ بِوَجَعٍ فِي رَأْسِهِ بِشِدَّةٍ لَمْ يَأْكُلِ الْعَشَاءَ مُطْلَقًا لِأَجَلِهِ .", "urdu": "حامد کا بھائی کل سخت بیمار ہوا، اس کے سر میں زور کا درد اٹھا، جس کی وجہ سے اس نے رات کا کھانا بالکل نہیں کھایا۔", "keywords": ["حامد", "بھائی", "بیمار", "درد"], "difficulty": "medium"}, {"id": 8, "arabic": "عَلَى الْمُسْلِمِينَ أَنْ يَعُدُّوا مَا لَهُمْ مُسْتَمِرًا كُلَّ عَامٍ وَلَا يَتَكَاسَلُوْا فِي أَدَاءِ الزَّكَاتِ كَسْلًا مُطْلَقًا ، إِنْ أَخْلَصُوا فِي أَدَاءِ هَذَا الْوَاجِبِ كُلَّ الْإِخْلَاصِ بَارَكَ اللَّهُ تَعَالَى فِي أَمْوَالِهِمْ بَرَكَةً كَثِيرَةً.", "urdu": "مسلمانوں کو چاہیے کہ وہ برابر ہر سال اپنے مال کا حساب کریں اور زکات کی ادائیگی میں بالکل سستی نہ کریں ، اگر وہ اس فریضے کو پورے اخلاص کے ساتھ ادا کرتے رہیں گے تو اللہ تعالیٰ ان کے مال میں خوب برکت دے گا۔", "keywords": ["مسلمان", "مال", "زکات", "برکت"], "difficulty": "hard"}, {"id": 9, "arabic": "يَجِبُ أَنْ تَكُونَ فِي كُلِّ بَلَدٍ مُؤسَّسَةٌ ثَقَافِيَّةٌ تَنْشُرُ التَّعْلِيمَ نَشْرًا كَثِيرًا وَتَخْدِمُ الدِّينَ خِدْمَةً حَسَنَةً .", "urdu": "ہر شہر میں ایک ایسے تعلیمی ادارے کی ضرورت ہے جو تعلیم کو خوب عام کرے اور دین کی بھی اچھی خدمت کرے۔", "keywords": ["شہر", "تعلیمی ادارہ", "تعلیم", "دین"], "difficulty": "medium"}, {"id": 10, "arabic": "الْغِذَاءُ الصَّحِيحُ ضَرُوْرِيٌّ لِلإِنْسَانِ الَّذِي يَسُدُّ الجُمْعَ وَالْعِظَامَ وَ يُقَوِيْهَا قُوَّةً كَثِيرَةً ، وَ يُعِينُ عَلَى دَمْلِ الْجُرُوْحِ إِعَانَةً أَيْضًا. وَ يُنَمِّي الْأَعْصَابَ", "urdu": "صحت مند غذا انسان کے لیے ضروری ہے جو بھوک مٹاتی ہے ، پٹھوں اور ہڈیوں کو بڑھاتی اور خوب طاقت ور بناتی ہے اور زخموں کو بھرنے میں بھی کافی مدد دیتی ہے۔", "keywords": ["غذا", "انسان", "صحت", "ہڈی"], "difficulty": "hard"}, {"id": 11, "arabic": "إِذَا كُنْتَ تُرِيدُ أَنْ تَفْعَلَ فِعْلًا هَامًا ، فَعَلَيْكَ أَنْ تُفَكِّرَ فِي جَمِيعِ جَوَانِبِهِ تَفْكِيْرًا وَتَسْتَشِيْرَ الْأَصْدِقَاءَ الأَوْفِيَاءَ أَيْضًا كَيْ لَا تُوَاجِهَ الضَّرَرَ.", "urdu": "اگر آپ کو کوئی اہم کام کرنا ہو تو پہلے اس کے تمام گوشوں پر خوب غور کریں اور مخلص دوستوں سے بھی مشورہ لیں تا کہ آپ نقصان سے دوچار نہ ہوں۔", "keywords": ["کام", "مشورہ", "دوست", "نقصان"], "difficulty": "medium"}, {"id": 12, "arabic": "لَمَّا وَصَلَتِ الثَّقَافَةُ الْإِسْلَامِيَّةُ إِلَى شَعْبٍ أَثَرَتْ فِي عَادَاتِهِ وَخُلُقِهِ أَثَرًا بَالغًا.", "urdu": "اسلامی تہذیب جب کسی قوم میں پہنچی تو ان کی عادات و اخلاق پر اس نے گہرا اثر چھوڑا۔", "keywords": ["اسلامی تہذیب", "قوم", "عادت", "اخلاق"], "difficulty": "medium"}, {"id": 13, "arabic": "تَأَثَرَ رِجَالُ الْهِنْدِ وَمَالِيزِيَا وَالصِّينِ بِالتَّجَارِ الْمُسْلِمِينَ وَالسَّائِحِيْنَ تَأْثْرًا كَبِيرًا ، وَعَامَلُوهُمْ مُعَامَلَةً حَسَنَةً.", "urdu": "ہندوستان ، ملیشیا اور چین کے لوگ مسلمان تاجروں اور سیاحوں سے بہت متاثر ہوئے اور ان کے ساتھ بہت اچھا برتاؤ کیا۔", "keywords": ["ہندوستان", "ملیشیا", "چین", "مسلمان تاجر"], "difficulty": "medium"}, {"id": 14, "arabic": "الْجَامِعَةُ الْأَشْرَفِيَّةُ لِأَهْلِ السُّنَّةِ وَالْجَمَاعَةِ مَعْهَدٌ عِلْمِيٌّ وَدِيْنِيٌّ فِي شِبْهِ الْقَارَةِ الَّتِي تَهْتَمُّ بِتَعْلِيمِ اللُّغَةِ الْعَرَبِيَّةِ وَآدَابِهَا إِضَافَةٌ إِلَى الْعُلُوْمِ وَالْفُنُوْنِ الْإِسْلَامِيَّةِ أَيْضًا اِهْتِمَامًا كَامِلًا ، يَكُوْنُ خِرِيجُوْهَا مُخْلِصِينَ مُتَيَقِظِيْنَ نُشَطَاءَ وَ يَنْتَمُوْنَ إِلَى مَجَالَاتٍ مُخْتَلِفَةٍ. وَ يَنْشُرُوْنَ التَّعَالِيمَ الْإِسْلَامِيَّةَ نَشْرًا كَثِيرًا.", "urdu": "جامعہ اشرفیہ بر صغیر میں اہل سنت و جماعت کا علمی و دینی ادارہ ہے جو اسلامی علوم وفنون کے ساتھ عربی زبان وادب کی تعلیم پر بھی بھر پور توجہ دیتا ہے، یہاں کہ فارغین مخلص، بیدار مغز متحرک اور فعال ہوتے ہیں جو مختلف میدانوں سے تعلق رکھتے ہیں اور اسلامی تعلیمات کی خوب خوب نشر و اشاعت کرتے ہیں۔", "keywords": ["جامعہ اشرفیہ", "اہل سنت", "علمی ادارہ", "عربی زبان"], "difficulty": "hard"}]}, {"tamreen_no": 21, "title": "التَّمْرِينُ (٢١)", "type": "ترجمہ اور مفعول فیہ", "instruction": "آنے والے جملوں کا اردو میں ترجمہ کرو اور رسم الخط لگا گر مفعول فیہ کی تعیین کرو۔", "total_questions": 7, "questions": [{"id": 1, "arabic": "تَعَطَّلَ مُحَرِّكُ السَّيَّارَةِ عِنْدَ مُنْحَنَى الطَّرِيقِ.", "urdu": "راستے کے موڑ پر گاڑی کا انجن خراب ہو گیا۔", "keywords": ["گاڑی", "انجن", "راستہ", "موڑ"], "difficulty": "easy"}, {"id": 2, "arabic": "يَسْتَعِينُ الْفَلَّاحُ فِي حَقْلِهِ بِالشَّادُوْفِ وَالفَأْسِ وَالْمُنْجَلِ وَالْمِحْرَاثِ وَالنَّوْرَجِ وَالسَّاقِيَةِ.", "urdu": "کسان اپنے کھیت میں ڈول، کلہاڑی، درانتی، ہل، غلہ گاہنے کی مشین اور رہٹ کی مدد لیتا ہے۔", "keywords": ["کسان", "کھیت", "ہل", "مشین"], "difficulty": "medium"}, {"id": 3, "arabic": "اتَّجَهْتُ نَحْوَ الْحَدِيقَةِ لِلاسْتِمْتَاعِ بِمَبَاهِجِهَا.", "urdu": "باغ کی خوب صورتی سے لطف اندوز ہونے کے لیے میں اس کی طرف گیا۔", "keywords": ["باغ", "خوبصورتی", "لطف"], "difficulty": "easy"}, {"id": 4, "arabic": "يَسْتَعْمِلُ الْمُهَنْدِسُ حِيْنَ عَمَلِهِ الْمِسْطَرَةَ وَالْمِنْقَلَةَ وَالْمُثَلَّثَ وَالْقَلَمَ وَالْوَرَقَةَ.", "urdu": "انجینئر اپنے کام کے وقت اسکیل ، آلہ ، مثلث، قلم اور کاغذ استعمال کرتا ہے۔", "keywords": ["انجینئر", "کام", "اسکیل", "قلم"], "difficulty": "medium"}, {"id": 5, "arabic": "يَسْتَخْدِمُ الْجَرَّاحُ أَثْنَاءَ عَمَلِيَّتِهِ الْمُشْرَطَ وَالْإِبْرَةَ وَالْمُقَصَّ وَالْمِنْظَارَ.", "urdu": "سرجن اپنے آپریشن کے دوران نشتر، انجکشن، قینچی اور دور بین کا استعمال کرتا ہے۔", "keywords": ["سرجن", "آپریشن", "نشتر", "قینچی"], "difficulty": "medium"}, {"id": 6, "arabic": "يَذْهَبُ الْقَادِرُ عَلَى أَدَاءِ فَرِيضَةِ الْحَقِّ إِلَى الْأَرَاضِي الْحِجَازِيَّةِ مُتَحَمِلًا الْمَتَاعِبَ وَالصِّعَابَ لَا يَثْنِيهِ عَنْ عَزِيمَتِهِ حَرٌّ يُلَاقِيْهِ زَمَنَ الصَّفِ ، أَوْ بَرْدٌ يُصِيبُهُ أَيَّامَ الشَّتَاءِ ، حَتَّى إِذَا وَصَلَ إِلَى مَكَّةَ بِسَلَامَةِ اللَّهِ طَافَ حَوْلَ الْكَعْبَهِ ، وَسَعَى بَيْنَ الصَّفَا وَالْمَرْوَةِ ، وَأَتَمَّ جَمِيعَ الْمَنَاسِكِ رَاضِيًا صَابِرًا . ( تيسير النحو، ص : ٢١٦)", "urdu": "تندرست آدمی مشکلوں اور دشواریوں کو برداشت کر کے حجاز کی زمین پر فریضہ حج ادا کرنے جاتا ہے، گرمی کے زمانے کی گرمی یا سردی کے دنوں کی سردی اس کو اس کے ارادے سے باز نہیں رکھتی ہے یہاں تک کہ وہ اللہ کی سلامتی کے ساتھ مکہ مکرمہ جاتا ہے کعبہ کے ارد گرد طواف کرتا ہے ، صفا مروہ کے درمیان سعی کرتا ہے اور راضی برضا و صابر رہ کر تمام ارکان حج پورے کرتا ہے۔", "keywords": ["حج", "حجاز", "مکہ", "کعبہ"], "difficulty": "hard"}, {"id": 7, "arabic": "اجْتَمَعَ مَجْلِسُ الْمُدَرِّسِينَ ظُهْرَ السَّيْتِ الْمَاضِي لِلنَّظْرِ فِي أَحْوَالِ الطُّلابِ ، وَقَدْ اسْتَمَرَّ اجْتِمَاعُهُمْ سَاعَةً ، انْصَرَ فُوْا بَعْدَهَا إِلَى بُيُؤْتِهِمْ ، ثُمَّ عَادُوْا فَاجْتَمَعُوْا مَسَاءً، وَقَدْ قَرَّرُوْا إِجْرَاءَ اِمْتِحَانِ مُسَابَقَةٍ بَيْنَ الْفَتْرَتَيْنِ الثَّالِثَةِ وَالرَّابِعَةِ، يُمْنَحُ الْفَائِرُ فِيْهَا جَائِزةً ثَمِيْنَةٌ، وَبَيْنَمَا كَانَ الطَّلَابُ يَقِفُوْنَ فِي صُفُوفِهِمْ صَبَاحًا وَقَفَ الْمُشْرِفُ أَمَامَهُمْ وَأَعْلَمَهُمْ ذَلِكَ النَّبَاءَ ، وَ حَنَّهُمْ عَلَى الاجْتِهَادِ فِي دُرُوسِهِمْ ، حَتَّى يَكُوْنُوْا عِنْدَ حُسْنٍ ظَنْ أَسَاتِذَتِهِمْ (قواعد اللغة العربية ، الثاني المتوسط ، ص : ۱۰۰)", "urdu": "گزشتہ ہفتہ دو پہر کے وقت طلبہ کے حالات کا جائزہ لینے کے لیے مدرسین کی نشست ہوئی اور ان کی یہ نشست ایک گھنٹہ جاری رہی اس کے بعد وہ اپنے گھروں کو چلے گیے پھر لوٹے اور شام کو اکٹھا ہوئے ، انہوں نے تیسرے اور چوتھے وقفہ کے درمیان مقابلہ کا امتحان کرانے کا فیصلہ کیا جس میں کامیاب ہونے والے کو قیمتی انعام دیا جائے گا جس وقت طلبہ صبح کے وقت اپنی درسگاہوں میں بیٹھے تھے ، نگراں ان کے سامنے کھڑا ہوا اور انھیں یہ خبر سنائی، انھیں اسباق میں محنت کرنے پر ابھارا تا کہ وہ حُسن ظن کے مطابق ہو جائیں۔", "keywords": ["مدرسین", "نشست", "امتحان", "انعام"], "difficulty": "hard"}]}, {"tamreen_no": 22, "title": "التَّمْرِينُ (٢٢)", "type": "عربی میں ترجمہ", "instruction": "عربی میں ترجمہ کرو۔", "total_questions": 6, "questions": [{"id": 1, "arabic": "تُغْلَقُ الْمَدَارِسُ الرَّسْمِيَّةُ فِي فَصْلِ الصَّيْفِ لِأَنَّ الْحَرَّ يُرْعِجُ الْحِسْمَ وَالذَّهْنَ ، وَ يُقْلِقُ الطَّلَبَةَ وَالْأَسَاتِذَةَ لَيْلًا وَنَهَارًا، فَهُمْ لَا يَفْعَلُوْنَ الدَّرْسَ وَ الْمُطَالَعَةَ عَلَى الْوَجْهِ الصَّحِيحِ .", "urdu": "سرکاری اسکول موسم گرما میں بند کر دیے جاتے ہیں ، کیوں کہ گرمی جسم اور ذہن کو جھنجھوڑ دیتی ہے ، شب و روز طلبہ اور اساتذہ کو پریشان رکھتی ہے تو وہ صحیح طریقے پر درس اور مطالعہ کا کام نہیں کر پاتے ہیں۔", "keywords": ["اسکول", "گرمی", "طالب علم", "استاذ"], "difficulty": "hard"}, {"id": 2, "arabic": "تَنْعَقِدُ نَدْوَهُ عِلْمِيَّةٌ مَسَاءَ الْغَدِ فِي دِهْلِي عَلَى عُنْوَانِ مَشَاكِلِ الْمُسْلِمِينَ الرَّاهِنَةِ وَعِلَاجِهَا يَخْطُبُ فِيْهَا أَوَّلًا وَزِيْرُ الدَّاخِلِيَّةِ ، يُشَارِكُ فِيْهَا الزُّعَمَاءُ الْمُسْلِمُوْنَ مِنَ الْأَقَالِيمِ الْمُخْتَلِفَةِ لِلدَّوْلَةِ.", "urdu": "کل شام کو دہلی میں موجود مسلم مسائل ور ان کا حل “ کے موضوع پر ایک سیمینار منعقد ہوگا، جس میں سب سے پہلا خطبہ وزیر داخلہ کا ہوگا ، اس میں ملک کے مختلف صوبوں کے مسلم نمائندے شریک ہوں گے۔", "keywords": ["دہلی", "سیمینار", "مسلم", "وزیر داخلہ"], "difficulty": "hard"}, {"id": 3, "arabic": "زَارَ وَقْدْ مِنَ الْأَسَائِدَةِ الْمُمَثْلِينَ لِلْمَدَارِسِ الْعَرَبِيَّةِ الْمُسَاعَدَةَ كَبِيرَ الْوُزَرَاءِ فِي أَتْرَا بِرادِيش عَقِيْبَ الظُّهْرِ الثَّامِنَ وَ الْعِشْرِينَ مِنْ ابْرِيل وَأَطْلَعَهُ عَلَى أَزْمَاتِهِمْ سَمِعَ أَحَادِيثَهُمْ بِعِنَايَةٍ كَامِلَةٍ وَأَكَدَ لَهُمْ حَلَّ مَشَاكِلِهِمْ الْمُتَنَوِعَةِ سَرِيعًا جَدًّا.", "urdu": "۲۸ اپریل کو دو پہر کے بعد امداد یافتہ عربی مدارس کے نمائندہ اساتذہ کا ایک وفد وزیر اعلی اتر پردیش سے ملا اور انھیں اپنی گوناگوں پریشانیوں سے واقف کرایا، وزیر اعلی نے پوری توجہ کے ساتھ ان کی باتیں سنیں اور ان کی مشکلات بہت جلد حل کرنے کا یقین دلایا۔", "keywords": ["وفد", "مدارس", "وزیر اعلی", "اتر پردیش"], "difficulty": "hard"}, {"id": 4, "arabic": "عِنْدَ بَيْتِي مُتَنَزَّةٌ كَبِيرٌ ، يَأْتِيْهَا النَّاسُ مِنَ الْمَنَاطِقِ الْبَعِيدَةِ لِلنُّرْهَةِ وَالرِّيَاضَةِ الْبَدَنِيَّةِ صَبَاحًا وَمَسَاءً ، لِمُرَاقَبَةِ أَغْرَاسِهَا وَأَزْهَارِهَا بُسْتَانِيُّوْنَ وَحُرَّاسٌ يَقُوْمُوْنَ بِوَاجِ  "باغ", "نہر", "مسجد"], "difficulty": "hard"}]}, {"tamreen_no": 23, "title": "التَّمْرِينُ (٢٣)", "type": "ترجمہ", "instruction": "اردو میں ترجمہ کرو۔", "total_questions": 2, "questions": [{"id": 1, "arabic": "مِنْ طَرِيْفِ مَا يُرْوِي أَنَّ صَيَّادًا جَلَسَ تَحْتَ ظِلَّ شَجَرَةٍ، لِيَسْتَرِيحَ سَاعَةً مِنْ عَنَاءِ التَّجْوَالِ ، لَكِنَّهُ مَالَبِثَ أَنْ سَمِعَ زَثِيْرًا خَلْفَ الرَّابِيَةِ ، فَتَلَفَّتَ يَمِينًا وَ يَسَارًا، وَإِذَا أَسَدٌ يَظْهَرُ أَمَامَهُ ، وَيَمَدُّ قَدَمَهُ مُتَأَلَّا.", "urdu": "ایک انوکھی بات جس کو بیان کیا جاتا ہے کہ ایک شکاری دھوڑ دھوپ کی تکان سے کچھ دیر آرام کرنے کے لیے ایک درخت کے سائے کے نیچے بیٹھا، لیکن فورا ٹیلہ کے پیچھے اس نے ایک دہاڑ سنی تو وہ دائیں بائیں پھرا، اچانک ایک شیر اس کے سامنے ظاہر ہوتا ہے وہ تکلیف اور درد محسوس کرتے ہوئے اپنا قدم آگے بڑھاتا ہے۔", "keywords": ["شکاری", "درخت", "شیر", "ٹیلہ"], "difficulty": "hard"}, {"id": 2, "arabic": "لَقَدْ حَبَا اللهُ مِصْرَ مَوْقِعًا فَرِيدًا مُتَمَيِّرًا ، فَجَؤُهَا مُعْتَدِلْ لَيْلًا وَنَهَارٌ ، لَا تَشْتَدُّ حَرَارَتُهُ صَيْفًا، وَلَا تَلْسَعُ بُرُودَتُهُ شِتَاءًا ، كَمَا مَنَحَ اللَّهُ مِصْرَ نِيْلًا عَظِيمًا ، يُعَدُّ شَرَيَانَ الْحَيَاةِ فِيهَا ، فَقَدْ نَشَأْتِ الْحَضَارَةُ الْمُصْرِيَّةُ الْقَدِيمَّةُ مُنْذُ آلَافِ السِّنِينَ عَلَى جَانِبَيْهِ يَمِينًا وَشِمَالًا ، وَفَوْقَ أَرْضِ مِصْرَ نَجِدُ الْمَعَالِمَ السَّيَاحِيَّةَ الْقَدِيمَةَ وَالْحَدِيثَةَ الَّتِي جَعَلَتِ السُّيَّاحَ يَفِدُوْنَ إِلَيْهَا ، وَ يَقِفُوْنَ أَمَا مَهَا مَبْهُوْرِيْنَ ، وَإِقْبَالُهُمْ كَسْبٌ كَبِيرٌ لَاقْتِصَادِ مصر.", "urdu": "اللہ تعالی نے مصر کو یکتا انو بھی جگہ بنایا ہے اس کی فضارات و دن معتدل رہتی ہے، اس کی گرمی موسم گرما میں شدید نہیں ہوتی ہے اور اس کی ٹھنڈک موسم سرما میں نہیں کاٹتی ہے، جس طرح اللہ تعالی نے مصر کو ایسا عظیم دریائے نیل عطا کیا ہے جس کو مصر میں زندگی کی شہ رگ شمار کیا جاتا ہے ، پرانی مصری تہذیب و ثقافت نے ہزاروں سال تک اس کے دائیں بائیں دونوں طرف نشو و نما پائی، اور مصر کی زمین پر ہم ان پرانی اور نئی سیاحتی نشانیوں کو پاتے ہیں جن کی وجہ سے سیاح اس کی طرف آتے ہیں اور ان کے سامنے حیرا
