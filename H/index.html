  let chunks = []; let cur = '';
  parts.forEach((p, i) => {
    let piece = p + (i < parts.length - 1 ? '،' : '۔');
    if((cur + ' ' + piece).trim().length > 140 && cur.length > 0){ chunks.push(cur.trim()); cur = piece; }
    else { cur = (cur + ' ' + piece).trim(); }
  });
  if(cur) chunks.push(cur.trim());
  return chunks;
}

function blockIndexForTamreen(no){
  for(let i=0;i<BLOCKS.length;i++){ if(no >= BLOCKS[i][0] && no <= BLOCKS[i][1]) return i; }
  return -1;
}

function defaultState(){
  let t = {};
  APP_DATA.forEach(ex => {
    t[ex.tamreen_no] = { learnBatch:0, learnDone:false, testIndex:0, testDone:false, results:{}, score:null };
  });
  let blocks = {};
  BLOCKS.forEach((b,i) => { blocks[i] = { done:false, order:null, index:0, results:{}, score:null }; });
  return { tamreens:t, blocks:blocks, screen:'dashboard', current:null };
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* first run, no saved state */ }
  return defaultState();
}
async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('save failed', e); }
}

function tamreenStatus(no){
  const s = state.tamreens[no];
  if(s.testDone) return 'done';
  if(s.learnDone) return s.testIndex > 0 ? 'testing' : 'ready_test';
  if(s.learnBatch > 0) return 'learning';
  return 'new';
}

function daysLeft(target){
  const now = new Date();
  return Math.max(0, Math.ceil((target - now) / 86400000));
}

async function go(screen, current){
  state.screen = screen;
  if(current !== undefined) state.current = current;
  await saveState();
  render();
}

function esc(s){ return (s||'').toString(); }

/* ================= RENDER ================= */
function render(){
  const app = document.getElementById('app');
  if(state.screen === 'dashboard') app.innerHTML = renderDashboard();
  else if(state.screen === 'learn') app.innerHTML = renderLearn();
  else if(state.screen === 'test') app.innerHTML = renderTest();
  else if(state.screen === 'revision') app.innerHTML = renderRevisionScreen();
  else if(state.screen === 'summary') app.innerHTML = renderSummary();
  else if(state.screen === 'review') app.innerHTML = renderReview();
  else if(state.screen === 'examIntro') app.innerHTML = renderExamIntro();
  window.scrollTo(0,0);
}

function renderDashboard(){
  const totalDone = APP_DATA.filter(t => state.tamreens[t.tamreen_no].testDone).length;
  const pct = Math.round((totalDone / APP_DATA.length) * 100);
  const dSoft = daysLeft(TARGET_SOFT);
  const dExam = daysLeft(TARGET_EXAM);

  let beads = '';
  APP_DATA.forEach((t, i) => {
    const st = tamreenStatus(t.tamreen_no);
    const isMarker = t.tamreen_no % 5 === 0;
    const cls = st === 'done' ? 'done' : (st === 'learning' || st === 'ready_test' || st === 'testing' ? 'progress' : '');
    beads += `<div class="bead ${isMarker?'marker':''} ${cls}" onclick="scrollToCard(${t.tamreen_no})" title="تمرین ${t.tamreen_no}"></div>`;
    if(i < APP_DATA.length - 1) beads += `<div class="thread"></div>`;
  });

  let continueHtml = '';
  if(state.lastActive){
    const t = byNo(state.lastActive);
    if(t && !state.tamreens[state.lastActive].testDone){
      continueHtml = `<div class="continue-card" onclick="resumeLast()">
        <div class="cc-title">↩ جہاں سے چھوڑا تھا وہیں سے جاری رکھیں</div>
        <div class="cc-sub">تمرین ${t.tamreen_no} — ${esc(t.title)}</div>
      </div>`;
    }
  }

  let listHtml = '';
  BLOCKS.forEach((b, bi) => {
    listHtml += `<div class="section-label">تمرین ${b[0]} تا ${b[1]}</div><div class="list">`;
    for(let no = b[0]; no <= b[1]; no++){
      const t = byNo(no);
      if(!t) continue;
      const st = tamreenStatus(no);
      const badgeMap = { new:['نیا','new'], learning:['پڑھائی جاری','learning'], ready_test:['امتحان دو','test'], testing:['امتحان جاری','test'], done:['مکمل ✓','done'] };
      const sc = state.tamreens[no].score;
      const badgeText = st === 'done' && sc !== null ? `مکمل ✓ ${sc}%` : badgeMap[st][0];
      listHtml += `<div class="card" id="t-${no}" onclick="openTamreen(${no})">
        <div class="idx"><bdi class="num">${no}</bdi></div>
        <div class="body">
          <div class="title">${esc(t.title)}</div>
          <div class="meta">${esc(t.instruction)}</div>
        </div>
        <div class="badge ${badgeMap[st][1]}">${badgeText}</div>
      </div>`;
    }
    listHtml += `</div>`;

    const blk = state.blocks[bi];
    const tamreensInBlock = [];
    for(let no = b[0]; no <= b[1]; no++) tamreensInBlock.push(no);
    const allDone = tamreensInBlock.every(no => state.tamreens[no].testDone);
    const locked = !allDone;
    listHtml += `<div class="list" style="margin-top:8px;">
      <div class="card revision-card ${locked?'locked':''}" onclick="${locked?'':'openRevision('+bi+')'}">
        <div class="idx">↺</div>
        <div class="body">
          <div class="title">پانچوں تمرینوں کا ریویژن</div>
          <div class="meta">${locked ? 'پہلے اوپر کی تمرینیں مکمل کرو' : (blk.done ? 'مکمل ✓ ' + blk.score + '%' : 'شروع کرنے کے لیے تیار')}</div>
        </div>
        ${blk.done ? '<div class="badge done">مکمل ✓</div>' : (locked ? '' : '<div class="badge test">شروع کرو</div>')}
      </div>
    </div>`;
  });

  return `
  <div class="topbar">
    <div class="brand-row">
      <div class="brand">
        <h1>ترجمہ مشق</h1>
        <p>عربی ⇄ اردو — امتحان کی تیاری</p>
      </div>
      <div class="countdown">
        <div class="n"><bdi class="num">${dSoft}</bdi></div>
        <div class="l">دن (٨ اگست)</div>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="tasbih">${beads}</div>
  </div>
  ${continueHtml}
  ${listHtml}
  <div class="settings-row"><span onclick="resetProgress()">تمام پیش رفت صاف کریں</span></div>
  `;
}

function scrollToCard(no){
  const el = document.getElementById('t-' + no);
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function resumeLast(){
  const no = state.lastActive;
  openTamreen(no);
}

async function openTamreen(no){
  const st = tamreenStatus(no);
  state.lastActive = no;
  state.chunkShown = 1;
  state.revealedNow = false;
  if(st === 'new' || st === 'learning') await go('learn', no);
  else if(st === 'ready_test' || st === 'testing') await go('test', no);
  else await go('review', no);
}

async function openRevision(blockIndex){
  const blk = state.blocks[blockIndex];
  if(!blk.order){
    let pool = [];
    for(let no = BLOCKS[blockIndex][0]; no <= BLOCKS[blockIndex][1]; no++){
      const t = byNo(no);
      if(!t) continue;
      t.questions.forEach(q => pool.push({tamreen_no:no, id:q.id}));
    }
    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    blk.order = pool;
    blk.index = 0;
    blk.results = {};
  }
  state.chunkShown = 1;
  state.revealedNow = false;
  await go('revision', blockIndex);
}

async function redoRevision(bi){
  const blk = state.blocks[bi];
  blk.order = null;
  blk.index = 0;
  blk.results = {};
  await openRevision(bi);
}

function browsePractice(no){
  state.current = no;
  state.practiceMode = true;
  state.practiceBatch = 0;
  go('learn', no);
}

/* ---------------- LEARN ---------------- */
function renderLearn(){
  const t = byNo(state.current);
  const dir = getDirection(t.instruction);
  const bs = batchSizeFor(t);
  const s = state.tamreens[t.tamreen_no];
  const practicing = !!state.practiceMode;
  const totalBatches = Math.ceil(t.questions.length / bs);
  const batchIdx = practicing ? (state.practiceBatch || 0) : s.learnBatch;
  const startI = batchIdx * bs;
  const items = t.questions.slice(startI, startI + bs);
  const isLast = batchIdx >= totalBatches - 1;

  let cards = '';
  items.forEach(q => {
    const srcText = dir === 'ar2ur' ? q.arabic : q.urdu;
    const tgtText = dir === 'ar2ur' ? q.urdu : q.arabic;
    const srcCls = dir === 'ar2ur' ? 'arabic' : 'urdu';
    const tgtCls = dir === 'ar2ur' ? 'urdu' : 'arabic';
    const chunks = chunkText(srcText);
    const diffCls = 'diff-' + (q.difficulty || 'medium');
    const kw = (q.keywords || []).map(k => `<span class="kw">${esc(k)}</span>`).join('');

    if(chunks.length > 1){
      cards += `<div class="qcard" data-qid="${q.id}" data-chunks='${JSON.stringify(chunks).replace(/'/g,"&#39;")}' data-shown="1">
        <div class="src ${srcCls}" id="src-${q.id}">${esc(chunks[0])}</div>
        <div class="chunk-btn" onclick="revealChunk(${q.id})" id="cbtn-${q.id}">اگلا حصہ دیکھیں (${chunks.length - 1} باقی)</div>
        <div class="divider" style="display:none" id="div-${q.id}"></div>
        <div class="tgt ${tgtCls}" style="display:none" id="tgt-${q.id}">${esc(tgtText)}</div>
        <div class="kw-row"><span class="diff-dot ${diffCls}"></span>${kw}</div>
      </div>`;
    } else {
      cards += `<div class="qcard">
        <div class="src ${srcCls}">${esc(srcText)}</div>
        <div class="divider"></div>
        <div class="tgt ${tgtCls}">${esc(tgtText)}</div>
        <div class="kw-row"><span class="diff-dot ${diffCls}"></span>${kw}</div>
      </div>`;
    }
  });

  return `
  <div class="screen-head">
    <div class="back-btn" onclick="backToDash()">‹</div>
    <div class="screen-title">
      <h2>تمرین ${t.tamreen_no} — ${practicing ? 'دوبارہ پڑھائی' : 'پڑھائی'}</h2>
      <p>${dir === 'ar2ur' ? 'عربی → اردو' : 'اردو → عربی'} · بیچ <bdi class="num">${batchIdx+1}/${totalBatches}</bdi></p>
    </div>
  </div>
  ${cards}
  <div class="footer-bar">
    <div class="btn btn-primary" onclick="nextBatch(${isLast})">${isLast ? (practicing ? 'بند کرو' : 'امتحان شروع کرو') : 'اگلا بیچ'}</div>
  </div>
  `;
}

function revealChunk(qid){
  const el = document.getElementById('src-' + qid);
  const card = el.closest('.qcard');
  const chunks = JSON.parse(card.getAttribute('data-chunks'));
  let shown = parseInt(card.getAttribute('data-shown'));
  shown += 1;
  card.setAttribute('data-shown', shown);
  el.textContent = chunks.slice(0, shown).join(' ');
  const btn = document.getElementById('cbtn-' + qid);
  if(shown >= chunks.length){
    btn.style.display = 'none';
    document.getElementById('div-' + qid).style.display = 'block';
    document.getElementById('tgt-' + qid).style.display = 'block';
  } else {
    btn.textContent = 'اگلا حصہ دیکھیں (' + (chunks.length - shown) + ' باقی)';
  }
}

async function nextBatch(isLast){
  if(state.practiceMode){
    if(isLast){
      state.practiceMode = false;
      await go('review', state.current);
    } else {
      state.practiceBatch = (state.practiceBatch || 0) + 1;
      await saveState();
      render();
    }
    return;
  }
  const t = byNo(state.current);
  const s = state.tamreens[t.tamreen_no];
  if(isLast){
    s.learnDone = true;
    state.chunkShown = 1;
    state.revealedNow = false;
    await go('examIntro', t.tamreen_no);
  } else {
    s.learnBatch += 1;
    await saveState();
    render();
  }
}

function renderExamIntro(){
  const t = byNo(state.current);
  return `
  <div class="screen-head">
    <div class="back-btn" onclick="backToDash()">‹</div>
    <div class="screen-title"><h2>تمرین ${t.tamreen_no}</h2></div>
  </div>
  <div class="intro-wrap">
    <div class="intro-card">
      <div class="intro-icon">📝</div>
      <h2>امتحان شروع ہونے والا ہے</h2>
      <p class="intro-sub">تمرین ${t.tamreen_no} — ${esc(t.title)}</p>
      <div class="intro-rules">
        <div class="rule">① ہر سوال ترجمے کے بغیر آئے گا — تھوڑا سوچو</div>
        <div class="rule">② لمبے جملے حصوں میں آئیں گے، ایک ایک حصہ دیکھو</div>
        <div class="rule">③ پھر "جواب دیکھو" دبا کر درست ترجمہ دیکھو</div>
        <div class="rule">④ خود بتاؤ: تمہارا جواب صحیح تھا یا غلط</div>
        <div class="rule">⑤ آخر میں سکور اور کمزور سوال نظر آئیں گے</div>
      </div>
      <div class="btn btn-primary" onclick="startExam()">ٹھیک ہے، شروع کرو</div>
    </div>
  </div>
  `;

async function startExam(){
  await go('test', state.current);
}

async function backToDash(){
  if(state.practiceMode){
    state.practiceMode = false;
    await go('review', state.current);
  } else {
    await go('dashboard');
  }
}

/* ---------------- TEST (single tamreen) ---------------- */
function renderTest(){
  const t = byNo(state.current);
  const dir = getDirection(t.instruction);
  const s = state.tamreens[t.tamreen_no];
  const total = t.questions.length;

  if(s.testIndex >= total){
    return buildSummaryFor('tamreen', t.tamreen_no);
  }

  const q = t.questions[s.testIndex];
  const srcText = dir === 'ar2ur' ? q.arabic : q.urdu;
  const tgtText = dir === 'ar2ur' ? q.urdu : q.arabic;
  const srcCls = dir === 'ar2ur' ? 'arabic' : 'urdu';
  const tgtCls = dir === 'ar2ur' ? 'urdu' : 'arabic';

  const chunks = chunkText(srcText);
  const shown = state.chunkShown || 1;
  const fullyShown = shown >= chunks.length;
  const displaySrc = chunks.slice(0, shown).join(' ');

  let footer;
  if(!fullyShown){
    footer = `<div class="btn btn-primary" onclick="revealTestChunk()">اگلا حصہ دیکھیں (${chunks.length - shown} باقی)</div>`;
  } else if(state.revealedNow){
    footer = `<div class="btn-row-3">
        <div class="btn btn-wrong" onclick="rateAnswer(${q.id}, 'wrong')">❌ غلط ہوا</div>
        <div class="btn btn-partial" onclick="rateAnswer(${q.id}, 'partial')">🟡 تھوڑا سا غلط</div>
        <div class="btn btn-correct" onclick="rateAnswer(${q.id}, 'correct')">✅ صحیح تھا</div>
      </div>`;
  } else {
    footer = `<div class="btn btn-primary" onclick="revealAnswer()">جواب دیکھو</div>`;
  }

  return `
  <div class="screen-head">
    <div class="back-btn" onclick="backToDash()">‹</div>
    <div class="screen-title">
      <h2>تمرین ${t.tamreen_no} — امتحان</h2>
      <p>${dir === 'ar2ur' ? 'عربی → اردو' : 'اردو → عربی'}</p>
    </div>
    <div class="qcounter"><bdi class="num">${s.testIndex+1}/${total}</bdi></div>
  </div>
  <div class="test-card"><div class="src ${srcCls}">${esc(displaySrc)}</div></div>
  <div id="reveal-zone">
  ${state.revealedNow ? `<div class="reveal"><div class="lbl">درست ترجمہ</div><div class="tgt ${tgtCls}">${esc(tgtText)}</div></div>` : ''}
  </div>
  <div class="footer-bar">${footer}</div>
  `;
}

function revealTestChunk(){
  state.chunkShown = (state.chunkShown || 1) + 1;
  render();
}

function revealAnswer(){
  state.revealedNow = true;
  render();
}

function statusWeight(v){
  if(v === true || v === 'correct') return 1;
  if(v === 'partial') return 0.5;
  return 0;
}
function statusOf(v){
  if(v === true) return 'correct';
  if(v === false) return 'wrong';
  return v;
}

async function rateAnswer(qid, status){
  const t = byNo(state.current);
  const s = state.tamreens[t.tamreen_no];
  s.results[qid] = status;
  s.testIndex += 1;
  state.revealedNow = false;
  state.chunkShown = 1;
  if(s.testIndex >= t.questions.length){
    const totalWeight = Object.values(s.results).reduce((sum, v) => sum + statusWeight(v), 0);
    s.score = Math.round((totalWeight / t.questions.length) * 100);
    s.testDone = true;
  }
  await saveState();
  render();
}

function buildSummaryFor(kind, key){
  if(kind === 'tamreen'){
    const t = byNo(key);
    const s = state.tamreens[key];
    const wrongIds = Object.keys(s.results).filter(id => statusOf(s.results[id]) !== 'correct');
    let wrongHtml = wrongIds.map(id => {
      const q = t.questions.find(qq => qq.id == id);
      const dir = getDirection(t.instruction);
      const srcText = dir === 'ar2ur' ? q.arabic : q.urdu;
      const tgtText = dir === 'ar2ur' ? q.urdu : q.arabic;
      const srcCls = dir === 'ar2ur' ? 'arabic' : 'urdu';
      const tgtCls = dir === 'ar2ur' ? 'urdu' : 'arabic';
      const st = statusOf(s.results[id]);
      const isPartial = st === 'partial';
      const badge = isPartial ? '<div class="status-badge partial">🟡 تھوڑا سا غلط</div>' : '<div class="status-badge wrong">❌ غلط</div>';
      return `<div class="wrong-item${isPartial ? ' partial-item' : ''}">${badge}<div class="src ${srcCls}">${esc(srcText)}</div><div class="tgt ${tgtCls}">${esc(tgtText)}</div></div>`;
    }).join('');
    return `
    <div class="screen-head"><div class="back-btn" onclick="backToDash()">‹</div><div class="screen-title"><h2>نتیجہ</h2></div></div>
    <div class="summary-hero">
      <div class="score-ring"><div class="pct"><bdi class="num">${s.score}%</bdi></div></div>
      <h3>تمرین ${t.tamreen_no} مکمل ہو گئی</h3>
    </div>
    ${wrongHtml ? `<div class="section-label">دوبارہ دیکھو</div><div class="wrong-list">${wrongHtml}</div>` : `<div class="empty">ماشاءاللہ، سب صحیح!</div>`}
    <div class="footer-bar">
      ${byNo(t.tamreen_no + 1) ? `<div class="btn btn-primary" onclick="openTamreen(${t.tamreen_no + 1})">اگلی تمرین شروع کرو ›</div>` : ''}
      <div class="btn ${byNo(t.tamreen_no + 1) ? 'btn-secondary' : 'btn-primary'}" onclick="finishTamreen()">واپس ڈیش بورڈ پر جاؤ</div>
      <div class="btn btn-secondary" onclick="browsePractice(${t.tamreen_no})">اسباق دوبارہ پڑھو</div>
      <div class="btn btn-secondary" onclick="retestTamreen()">دوبارہ امتحان دو</div>
    </div>`;
  } else {
    const blk = state.blocks[key];
    const wrongEntries = blk.order.filter(o => statusOf(blk.results[o.tamreen_no + '-' + o.id]) !== 'correct');
    let wrongHtml = wrongEntries.map(o => {
      const t = byNo(o.tamreen_no);
      const q = t.questions.find(qq => qq.id === o.id);
      const dir = getDirection(t.instruction);
      const srcText = dir === 'ar2ur' ? q.arabic : q.urdu;
      const tgtText = dir === 'ar2ur' ? q.urdu : q.arabic;
      const srcCls = dir === 'ar2ur' ? 'arabic' : 'urdu';
      const tgtCls = dir === 'ar2ur' ? 'urdu' : 'arabic';
      const st = statusOf(blk.results[o.tamreen_no + '-' + o.id]);
      const isPartial = st === 'partial';
      const badge = isPartial ? '<div class="status-badge partial">🟡 تھوڑا سا غلط</div>' : '<div class="status-badge wrong">❌ غلط</div>';
      return `<div class="wrong-item${isPartial ? ' partial-item' : ''}">${badge}<div class="meta" style="margin-bottom:4px; font-size:11px; color:var(--text-faint);">تمرین ${o.tamreen_no}</div><div class="src ${srcCls}">${esc(srcText)}</div><div class="tgt ${tgtCls}">${esc(tgtText)}</div></div>`;
    }).join('');
    return `
    <div class="screen-head"><div class="back-btn" onclick="backToDash()">‹</div><div class="screen-title"><h2>ریویژن کا نتیجہ</h2></div></div>
    <div class="summary-hero">
      <div class="score-ring"><div class="pct"><bdi class="num">${blk.score}%</bdi></div></div>
      <h3>تمرین ${BLOCKS[key][0]}-${BLOCKS[key][1]} کا ریویژن مکمل</h3>
    </div>
    ${wrongHtml ? `<div class="section-label">کمزور جگہیں</div><div class="wrong-list">${wrongHtml}</div>` : `<div class="empty">زبردست، سب یاد ہے!</div>`}
    <div class="footer-bar">
      <div class="btn btn-primary" onclick="finishRevision()">واپس ڈیش بورڈ پر جاؤ</div>
      <div class="btn btn-secondary" onclick="redoRevision(${key})">دوبارہ ریویژن کرو</div>
    </div>`;
  }
}

async function finishTamreen(){
  if(state.lastActive === state.current) state.lastActive = null;
  await go('dashboard');
}
async function retestTamreen(){
  const s = state.tamreens[state.current];
  s.testIndex = 0; s.results = {}; s.testDone = false; s.score = null;
  state.revealedNow = false;
  state.chunkShown = 1;
  await saveState();
  await go('test', state.current);
}

/* ---------------- REVISION ---------------- */
function renderRevisionScreen(){
  const bi = state.current;
  const blk = state.blocks[bi];
  const total = blk.order.length;

  if(blk.index >= total){
    const totalWeight = Object.values(blk.results).reduce((sum, v) => sum + statusWeight(v), 0);
    blk.done = true;
    blk.score = Math.round((totalWeight / total) * 100);
    saveState();
    return buildSummaryFor('block', bi);
  }

  const entry = blk.order[blk.index];
  const t = byNo(entry.tamreen_no);
  const q = t.questions.find(qq => qq.id === entry.id);
  const dir = getDirection(t.instruction);
  const srcText = dir === 'ar2ur' ? q.arabic : q.urdu;
  const tgtText = dir === 'ar2ur' ? q.urdu : q.arabic;
  const srcCls = dir === 'ar2ur' ? 'arabic' : 'urdu';
  const tgtCls = dir === 'ar2ur' ? 'urdu' : 'arabic';

  const chunks = chunkText(srcText);
  const shown = state.chunkShown || 1;
  const fullyShown = shown >= chunks.length;
  const displaySrc = chunks.slice(0, shown).join(' ');

  let footer;
  if(!fullyShown){
    footer = `<div class="btn btn-primary" onclick="revealTestChunk()">اگلا حصہ دیکھیں (${chunks.length - shown} باقی)</div>`;
  } else if(state.revealedNow){
    footer = `<div class="btn-row-3">
        <div class="btn btn-wrong" onclick="rateRevision('${entry.tamreen_no}-${entry.id}', 'wrong')">❌ غلط ہوا</div>
        <div class="btn btn-partial" onclick="rateRevision('${entry.tamreen_no}-${entry.id}', 'partial')">🟡 تھوڑا سا غلط</div>
        <div class="btn btn-correct" onclick="rateRevision('${entry.tamreen_no}-${entry.id}', 'correct')">✅ صحیح تھا</div>
      </div>`;
  } else {
    footer = `<div class="btn btn-primary" onclick="revealAnswer()">جواب دیکھو</div>`;
  }

  return `
  <div class="screen-head">
    <div class="back-btn" onclick="backToDash()">‹</div>
    <div class="screen-title">
      <h2>ریویژن — تمرین ${BLOCKS[bi][0]}-${BLOCKS[bi][1]}</h2>
      <p>تمرین ${entry.tamreen_no} سے سوال</p>
    </div>
    <div class="qcounter"><bdi class="num">${blk.index+1}/${total}</bdi></div>
  </div>
  <div class="test-card"><div class="src ${srcCls}">${esc(displaySrc)}</div></div>
  <div id="reveal-zone">
  ${state.revealedNow ? `<div class="reveal"><div class="lbl">درست ترجمہ</div><div class="tgt ${tgtCls}">${esc(tgtText)}</div></div>` : ''}
  </div>
  <div class="footer-bar">${footer}</div>
  `;
}

async function rateRevision(key, status){
  const bi = state.current;
  const blk = state.blocks[bi];
  blk.results[key] = status;
  blk.index += 1;
  state.revealedNow = false;
  state.chunkShown = 1;
  await saveState();
  render();
}

async function finishRevision(){ await go('dashboard'); }

/* ---------------- REVIEW (already done tamreen) ---------------- */
function renderReview(){
  const t = byNo(state.current);
  const s = state.tamreens[t.tamreen_no];
  const dir = getDirection(t.instruction);
  let items = t.questions.map(q => {
    const srcText = dir === 'ar2ur' ? q.arabic : q.urdu;
    const tgtText = dir === 'ar2ur' ? q.urdu : q.arabic;
    const srcCls = dir === 'ar2ur' ? 'arabic' : 'urdu';
    const tgtCls = dir === 'ar2ur' ? 'urdu' : 'arabic';
    const st = statusOf(s.results[q.id]);
    const borderColor = st === 'correct' ? 'var(--sage)' : (st === 'partial' ? 'var(--gold)' : 'var(--terracotta)');
    return `<div class="qcard" style="border-right:3px solid ${borderColor}">
      <div class="src ${srcCls}">${esc(srcText)}</div>
      <div class="divider"></div>
      <div class="tgt ${tgtCls}">${esc(tgtText)}</div>
    </div>`;
  }).join('');

  return `
  <div class="screen-head">
    <div class="back-btn" onclick="backToDash()">‹</div>
    <div class="screen-title"><h2>تمرین ${t.tamreen_no} — جائزہ</h2><p>سکور: ${s.score}%</p></div>
  </div>
  ${items}
  <div class="footer-bar">
    <div class="btn btn-primary" onclick="backToDash()">ڈیش بورڈ پر واپس جاؤ</div>
    <div class="btn btn-secondary" onclick="browsePractice(${t.tamreen_no})">اسباق دوبارہ پڑھو</div>
    <div class="btn btn-secondary" onclick="retestTamreen()">دوبارہ امتحان دو</div>
  </div>
  `;
}

async function resetProgress(){
  if(!confirm('کیا واقعی تمام پیش رفت صاف کر دی جائے؟ یہ واپس نہیں ہو سکتا۔')) return;
  state = defaultState();
  await saveState();
  render();
}

/* ---------------- init ---------------- */
(async function init(){
  document.getElementById('app').innerHTML = '<div class="empty">لوڈ ہو رہا ہے…</div>';
  state = await loadState();
  state.revealedNow = false;
  state.chunkShown = state.chunkShown || 1;
  render();
})();
</script>
</body>
